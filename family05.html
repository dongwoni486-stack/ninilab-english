<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 생활 첫걸음 (가족편) / Unit 05 Home & Neighbors
const ME = 'Me';
const big = s => `<span class="en say" style="font-size:15px;font-weight:800">${s}</span>`;
window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 생활 첫걸음 (가족편)',
  gradeLabel: '주재원 가족 생활 영어',
  theme: { main:'#ff7a45', sub:'#ffe6da', ink:'#2b2d3a', card:'#fff4ee' },
  unitNo: '05', unitTitle: 'Home & Neighbors', startPage: 36,
  cover: { title: 'Home &<br>Neighbors', subtitle: '아파트 입주, 수리 요청, 이웃 인사까지 · 가족편 Unit 5' },
  tip: '아파트 규정과 절차는 단지마다 달라요. 수리 요청은 온라인 포털이나 앱, 전화 등 방식이 다양하니 입주 때 leasing office에 한 번 물어보세요.',
  pages: [
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Talk', title: 'Leasing office에서 문의하기' },
      { type: 'listen' },
      { type: 'dialog', scene: '아파트 leasing office. 직원 Jessica와 대화해요.', lines: [
        { who: 'Jessica', en: 'Hi there! How can I help you?', ko: '안녕하세요! 무엇을 도와드릴까요?' },
        { who: ME, me: true, en: "Hi. I'm in unit 204. The AC isn't working.", ko: '204호예요. 에어컨이 작동하지 않아요.' },
        { who: 'Jessica', en: "I'm sorry about that. Since when?", ko: '불편하시겠네요. 언제부터요?' },
        { who: ME, me: true, en: 'Since last night. Can you send someone to fix it?', ko: '어젯밤부터요. 수리해 줄 사람을 보내 주실 수 있나요?' },
        { who: 'Jessica', en: "Sure. I'll put in a maintenance request.", ko: '네. 수리 요청을 접수해 드릴게요.' },
        { who: ME, me: true, en: 'Is it okay if I\'m not home?', ko: '제가 집에 없어도 괜찮을까요?' },
        { who: 'Jessica', en: "That's usually fine. They'll leave a note.", ko: '보통은 괜찮아요. 쪽지를 남겨 둘 거예요.' } ] },
      { type: 'section', tag: 'Key', title: '오늘의 핵심 표현' },
      { type: 'phrases', items: [
        { en: "The AC isn't working.", ko: '에어컨이 작동하지 않아요.', note: '고장 신고의 기본 틀: ~ isn\'t working' },
        { en: 'Can you send someone?', ko: '사람을 보내 주실 수 있나요?', note: '수리 기사 요청할 때 자연스러워요' },
        { en: 'Since last night.', ko: '어젯밤부터요.', note: 'since = ~이후로 계속' },
        { en: 'Is it okay if I\'m not home?', ko: '제가 집에 없어도 되나요?', note: '허락·확인을 구하는 정중한 질문' } ] },
      { type: 'tip', pose: 'idea', text: '<b>maintenance request</b>는 수리 요청서예요. 급한 고장(누수, 난방 등)은 emergency 연락처가 따로 있는 경우가 많으니 입주 때 확인해 두세요.' }
    ],
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Repair', title: '고장·불편 신고하기' },
      { type: 'phrases', items: [
        { en: "The sink is leaking.", ko: '싱크대에서 물이 새요.', note: 'leak = 새다' },
        { en: "The toilet won't flush.", ko: '변기 물이 안 내려가요.', note: "won't = 말을 안 듣는다는 느낌" },
        { en: "There's no hot water.", ko: '온수가 안 나와요.', note: 'There\'s no ~ = ~가 없어요' },
        { en: 'The light is out.', ko: '전등이 나갔어요.', note: 'out = 꺼진, 작동 안 되는' },
        { en: 'When can someone come by?', ko: '언제쯤 올 수 있나요?', note: 'come by = 잠깐 들르다' },
        { en: "I'd like to report a problem.", ko: '문제를 신고하고 싶어요.', note: '공손하게 시작하는 첫 문장' } ] },
      { type: 'section', tag: 'Neighbors', title: '이웃 인사와 택배' },
      { type: 'phrases', items: [
        { en: 'Hi! How y\'all doing?', ko: '안녕하세요! 다들 잘 지내세요?', note: "y'all = you all, 남부식 인사로 친근해요" },
        { en: "We just moved in.", ko: '저희 막 이사 왔어요.', note: '이웃에게 자기소개할 때' },
        { en: 'I think I got your package.', ko: '제가 댁 택배를 받은 것 같아요.', note: '잘못 배달된 택배를 전할 때' },
        { en: 'Did a package come for me?', ko: '제 앞으로 택배가 왔나요?', note: 'leasing office에 맡기는 경우도 있어요' } ] },
      { type: 'grid', items: [
        { label: '연습 1', level: '하', question: '싱크대에서 물이 새는 걸 신고하려고 해요. 알맞은 문장은?',
          choices: ['The sink is leaking.', 'The light is out.', "There's no hot water."], answer: '①', lines: 0,
          sol: { read: '물이 새는 상황에 맞는 문장을 골라요.', idea: 'leak = 새다. 문제 대상 + is leaking으로 말하면 신고 문장이 완성돼요.',
            steps: ['sink = 싱크대', 'is leaking = 새고 있다', '②는 전등, ③은 온수 문제'], check: '그림으로 상상하면 ①이 물이 새는 장면과 가장 가까워요.',
            parent: '집 안 물건 하나를 골라 "The ___ is leaking/isn\'t working."로 말해 보세요.' } },
        { label: '연습 2', level: '하', question: "이웃에게 친근하게 남부식으로 인사하는 말은?",
          choices: ['Where is the office?', "Hi! How y'all doing?", 'I need a refund.'], answer: '②', lines: 0,
          sol: { read: '남부식 인사를 찾는 문제예요.', idea: "y'all은 you all의 줄임말이고 앨라배마 같은 남부에서 흔히 들려요. 여러 사람에게 인사할 때 아주 자연스러워요.",
            steps: ['How are you? 계열의 인사 찾기', "How y'all doing? = 다들 어떻게 지내요?"],
            more: "한 사람에게는 How are you doing?, 가족 전체에겐 How y'all doing?을 쓸 수 있어요. 억지로 따라 하기보다 들었을 때 알아듣는 게 먼저예요." } }
      ] }
    ],
    [
      { type: 'stage', n: 3 },
      { type: 'grid', items: [
        { label: '연습 3', level: '중', question: '빈칸에 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">The AC ________ working.</span><br>(작동하지 않아요, 줄임말로)', lines: 1, answer: "isn't",
          sol: { read: '"~하지 않는다"를 줄임말로 쓰는 문제예요.', idea: 'is not의 줄임말은 isn\'t. 고장 신고에서 가장 많이 쓰는 틀이에요.',
            steps: ['AC 하나 = 3인칭 단수 → is', 'is not working → isn\'t working'],
            mistake: 'The AC not working처럼 is를 빼면 문장이 어색해요. 복수는 aren\'t working(예: The lights aren\'t working).' } },
        { label: '연습 4', level: '중', question: '잘못 온 택배를 이웃에게 전하는 문장을 완성하세요.<br><span class="en" style="font-size:15px;font-weight:800">I think I got your ________.</span>', lines: 1, answer: 'package',
          sol: { read: '택배를 뜻하는 단어를 써요.', idea: 'package = 택배·소포. 미국에서는 현관 앞에 두고 가는 경우가 많아서 이웃 집 것을 받는 일도 생겨요.',
            steps: ['I think I ~ = ~한 것 같아요', 'got your package = 당신 택배를 받았다'],
            check: 'parcel은 영국식이고 미국에서는 package를 훨씬 많이 써요.' } }
      ] },
      { type: 'card', label: '실전 롤플레이', level: '중', title: '배우자와 이사 첫 주 연습하기', question: '한 사람은 leasing office 직원 또는 이웃, 한 사람은 나를 맡아 보세요. 한 번 할 때마다 ○에 색칠해요.<br><span style="font-size:22px;letter-spacing:6px">○ ○ ○ ○ ○</span><br>잘 된 표현에 ✓ 하세요: □ The AC isn\'t working. □ We just moved in. □ How y\'all doing? □ Did a package come for me?',
        answer: '(활동)', sol: { idea: '고장 신고, 인사, 택배 확인은 입주 첫 주에 거의 확실히 쓰는 세 장면이에요. 역할을 바꿔 하면 듣기와 말하기가 같이 늘어요.', steps: ['고장 신고 먼저', '이웃 인사 이어서', '마지막에 택배 문의까지 연결'], parent: '배우자가 가끔 못 알아들은 척하며 Sorry?라고 하면 다시 말하기 연습이 돼요.' } },
      { type: 'stage', n: 4 },
      { type: 'card', label: '내 상황에 맞게 바꿔 쓰기', level: '상', title: '', question: '우리 집 상황에 맞게 빈칸을 채워 보세요.<br><span class="en" style="font-size:16px;font-weight:800;line-height:2.4">The ______________ isn\'t working.<br>It has been broken since ______________.<br>Can you send someone ______________?<br>Hi! We just moved into unit ______.</span>',
        answer: "(예) The dryer isn't working. It has been broken since yesterday. Can you send someone this week?",
        sol: { idea: '고장 대상, 시작 시점, 요청을 순서대로 말하면 상대가 상황을 빠르게 이해해요.',
          steps: ['The + 물건 + isn\'t working', 'since + 시점 (yesterday, Monday)', 'Can you send someone + 시기 (today, tomorrow)?'],
          mistake: "급한 문제(누수, 가스 냄새 등)는 일반 요청서가 아니라 emergency 연락처로 바로 연락하는 게 안전해요.",
          more: '말로 설명이 어려우면 사진을 찍어 두었다가 보여 주는 방법도 도움이 돼요.' } }
    ]
  ]
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--main:#22a06b;--sub:#d9f5e6;--ink:#16352a}
body{font-family:'Noto Sans KR',sans-serif;background:#f6f7f5;color:#222;padding-bottom:110px}
header{background:var(--main);color:#fff;padding:18px 18px 16px}
header .s{font-size:12px;opacity:.85}header h1{font-family:'Nunito',sans-serif;font-size:24px;line-height:1.2;margin-top:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink);margin:20px 16px 8px}
.scene{font-size:12px;color:#777;margin:0 16px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ln.me{background:var(--sub)}
.ln .who{font-size:11px;font-weight:900;color:var(--ink);min-width:58px;padding-top:3px}
.ln.me .who{color:var(--main)}
.ln .tx{flex:1}
.ln .en{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;line-height:1.35}
.ln .ko{font-size:13px;color:#666;margin-top:3px}
.ln .nt{font-size:12px;color:var(--main);margin-top:3px}
.ln.play{outline:3px solid #ffcf3f}
.ln.mute .en{color:transparent;text-shadow:0 0 9px rgba(0,0,0,.35)}
.hideko .ko{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{border:0;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;background:#eee;color:#333}
.bar button.on{background:var(--main);color:#fff}
.bar .big{background:var(--ink);color:#fff;min-width:110px}
.hint{font-size:12px;color:#888;margin:14px 16px}
</style></head><body>
<header><div class="s" id="hs"></div><h1 id="ht"></h1></header>
<div id="list"></div>
<p class="hint">문장을 누르면 한 번 들려줘요. <b>역할 놀이</b>를 켜면 내 대사 차례에 소리 없이 멈춰서, 직접 말해 볼 수 있어요.</p>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html='';
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), me:!!l.me});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), me:false});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
let rate=0.85, role=false, running=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ const wait = 1200 + it.en.split(' ').length*550; setTimeout(()=>{row.classList.remove('play');res();}, wait); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } running=false; e.target.textContent='▶ 전체 듣기'; };
document.getElementById('spd').onclick=e=>{ rate = rate===0.85?0.7:rate===0.7?1:0.85; e.target.textContent='속도 '+rate; };
document.getElementById('ko').onclick=e=>{ document.body.classList.toggle('hideko'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('hideko')?'한국어 켜기':'한국어 끄기'; };
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
speechSynthesis.getVoices();
</script></body></html>
