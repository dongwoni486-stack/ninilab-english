<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 학교 생존 회화 / Unit 1 First Day at School (샘플)
// KID: 아이 이름을 바꾸면 대화문 전체가 맞춤형으로 바뀜 (판매용은 'Mina' 등 기본값)
const KID = 'Seoah';
const big = s => `<span class="en say" style="font-size:15px;font-weight:800">${s}</span>`;
window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 학교 첫걸음',
  gradeLabel: '미국 초등학교 적응 회화',
  unitNo: '01', unitTitle: 'First Day at School', startPage: 4,
  cover: { title: 'Hello,<br>American School!', subtitle: '미국 초등학교 첫날부터 쓰는 생존 회화 · Unit 1~12',
    deco: '<svg width="230" height="230" viewBox="0 0 80 80"><rect x="10" y="30" width="60" height="40" fill="#fff" stroke="#16352a" stroke-width="2"/><polygon points="6,32 40,10 74,32" fill="#22a06b" stroke="#16352a" stroke-width="2"/><rect x="34" y="50" width="12" height="20" fill="#ff7a45" stroke="#16352a" stroke-width="2"/><rect x="16" y="38" width="12" height="10" fill="#d9f5e6" stroke="#16352a" stroke-width="1.5"/><rect x="52" y="38" width="12" height="10" fill="#d9f5e6" stroke="#16352a" stroke-width="1.5"/><line x1="40" y1="10" x2="40" y2="2" stroke="#16352a" stroke-width="1.5"/><rect x="40" y="2" width="10" height="6" fill="#ff4f7b"/></svg>' },
  tip: '부모님께: 하루 10분, 대화문을 역할을 바꿔 가며 3번씩 읽어 주세요. 완벽한 발음보다 "말을 꺼내는 용기"가 첫 달에는 훨씬 중요해요.',
  pages: [
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Talk', title: '첫날, 선생님과 친구 만나기' },
      { type: 'listen' },
      { type: 'dialog', scene: '교실 문 앞. 담임 선생님 Ms. Brown이 반겨 줘요.', lines: [
        { who: 'Ms. Brown', en: `Hi! You must be ${KID}. Welcome to our class!`, ko: `안녕! 네가 ${KID}구나. 우리 반에 온 걸 환영해!` },
        { who: KID, me: true, en: 'Hi. Nice to meet you.', ko: '안녕하세요. 만나서 반가워요.' },
        { who: 'Ms. Brown', en: 'Nice to meet you, too. Where are you from?', ko: '나도 반가워. 어디에서 왔니?' },
        { who: KID, me: true, en: "I'm from Korea.", ko: '한국에서 왔어요.' },
        { who: 'Ms. Brown', en: 'This is Emma. She will help you today.', ko: '이쪽은 Emma야. 오늘 너를 도와줄 거야.' },
        { who: 'Emma', en: `Hi, ${KID}! Do you want to sit with me?`, ko: '안녕! 나랑 같이 앉을래?' },
        { who: KID, me: true, en: 'Yes, please. Thank you!', ko: '응, 좋아. 고마워!' } ] },
      { type: 'section', tag: 'Key', title: '오늘의 핵심 표현' },
      { type: 'phrases', items: [
        { en: 'Nice to meet you.', ko: '만나서 반가워요.', note: '처음 만난 사람에게. 대답은 "Nice to meet you, too."' },
        { en: "I'm from Korea.", ko: '한국에서 왔어요.', note: '"I\'m Korea."라고 하면 "나는 한국이에요"가 돼요.' },
        { en: 'Yes, please.', ko: '네, 그렇게 해 주세요.', note: '제안을 받을 때 please를 붙이면 공손해요.' },
        { en: 'Thank you!', ko: '고마워요!', note: '미국에서는 작은 도움에도 꼭 말해요.' } ] },
      { type: 'tip', pose: 'idea', text: '미국 학교는 새로 온 친구에게 <b>buddy(도우미 친구)</b>를 붙여 주는 경우가 많아. 모르는 게 있으면 buddy에게 먼저 물어봐!' }
    ],
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Survival', title: '이것만은 꼭! 학교 생존 문장' },
      { type: 'phrases', items: [
        { en: 'Can I go to the bathroom?', ko: '화장실 가도 돼요?', note: '손을 들고 말해요. 수업 중에 그냥 나가면 안 돼요.' },
        { en: "I don't understand.", ko: '이해가 안 돼요.', note: '모르는 건 부끄러운 게 아니에요.' },
        { en: 'Can you say that again, please?', ko: '다시 한번 말해 줄래요?', note: '빨라서 못 들었을 때' },
        { en: 'I need help.', ko: '도움이 필요해요.', note: '' },
        { en: "I don't feel good.", ko: '몸이 안 좋아요.', note: '아프면 보건실(nurse\'s office)에 보내 줘요.' },
        { en: 'How do you say this in English?', ko: '이거 영어로 뭐라고 해요?', note: '물건을 가리키면서' } ] },
      { type: 'section', tag: 'Listen', title: '선생님 말 알아듣기 (교실 지시어)' },
      { type: 'phrases', items: [
        { en: 'Line up, please.', ko: '줄 서세요.', note: '쉬는 시간·점심 전에 매일 들어요.' },
        { en: 'Raise your hand.', ko: '손 드세요.', note: '말하기 전에 손 들기' },
        { en: 'Take out your pencil.', ko: '연필 꺼내세요.', note: '' },
        { en: "It's time to clean up.", ko: '정리할 시간이에요.', note: '' } ] },
      { type: 'grid', items: [
        { label: '연습 1', level: '하', question: '선생님 말을 듣고 해야 할 행동을 고르세요.<br>' + big('Raise your hand.'),
          choices: ['🙋 손 들기', '🧍 줄 서기', '✏️ 연필 꺼내기'], answer: '①', lines: 0,
          sol: { idea: 'raise는 "들어 올리다", hand는 "손". 두 단어를 합치면 "손을 들어 올려라".',
            steps: ['hand(손)를 먼저 알아들어요', 'raise(들다)와 연결 → 손을 들기'],
            mistake: 'hand만 듣고 "손 씻기"로 착각할 수 있어요. 손 씻기는 "Wash your hands."예요.',
            parent: '"Raise your hand!"라고 말하면 아이가 손을 드는 놀이를 해 보세요.' } },
        { label: '연습 2', level: '하', question: '수업 중에 화장실에 가고 싶어요. 손을 들고 뭐라고 말할까요?',
          choices: ['I need help.', 'Can I go to the bathroom?', 'Nice to meet you.'], answer: '②', lines: 0,
          sol: { idea: '"Can I ~?"는 <b>허락을 구하는</b> 말이에요. 선생님께 "~해도 돼요?"라고 물을 때 써요.',
            steps: ['하고 싶은 것: 화장실에 가기 = go to the bathroom', '허락 구하기: Can I + 하고 싶은 것 + ?', '→ Can I go to the bathroom?'],
            more: '같은 틀로 "Can I get some water?(물 마셔도 돼요?)", "Can I sit here?(여기 앉아도 돼?)"도 만들 수 있어요.',
            parent: '"물 마시고 싶을 땐 뭐라고 할까?" 하고 Can I 문장을 만들어 보게 해 주세요.' } }
      ] }
    ],
    [
      { type: 'stage', n: 3 },
      { type: 'grid', items: [
        { label: '연습 3', level: '중', question: '빈칸에 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">A: Where are you from?<br>B: I\'m ________ Korea.</span>', lines: 1, answer: 'from',
          sol: { idea: '"어디에서 왔니?(Where ~ from?)"에는 똑같이 from을 넣어 대답해요. 질문 속에 답의 단어가 숨어 있어요.',
            steps: ['질문 끝의 from을 찾아요', '대답: I\'m from + 나라 이름'],
            mistake: '"I\'m Korea."는 "나는 한국이다"라는 뜻이 돼요. 나라 사람이라고 할 때는 "I\'m Korean."이에요.' } },
        { label: '연습 4', level: '중', question: '선생님 말이 너무 빨라서 못 알아들었어요. 공손하게 다시 부탁하는 문장을 완성하세요.<br><span class="en" style="font-size:15px;font-weight:800">Can you say that ________, please?</span>', lines: 1, answer: 'again',
          sol: { idea: 'again = 다시. please를 붙이면 공손한 부탁이 돼요.',
            steps: ['say that = 그걸 말하다', 'again = 다시 → "그걸 다시 말해 줄래요?"'],
            check: '못 알아들었을 때 "What?"만 말하면 퉁명스럽게 들릴 수 있어요. 이 문장이 훨씬 좋아요.',
            more: '"Can you speak slowly, please?(천천히 말해 줄래요?)"도 함께 익혀 두면 좋아요.' } }
      ] },
      { type: 'card', label: '역할 놀이', level: '중', title: ' 엄마·아빠와 첫날 연습하기', question: '부모님이 Ms. Brown과 Emma를, 나는 나 자신을 맡아 앞 쪽의 대화를 해 보세요. 한 번 할 때마다 ○에 색칠해요.<br><span style="font-size:22px;letter-spacing:6px">○ ○ ○ ○ ○</span><br>잘 된 표현에 ✓ 하세요: □ Nice to meet you. □ I\'m from Korea. □ Yes, please. □ Thank you!',
        answer: '(활동)', sol: { idea: '회화는 "읽기"가 아니라 "주고받기"예요. 상대 말을 듣고 바로 대답하는 연습이 실제 첫날 긴장을 줄여 줘요.', steps: ['처음엔 책을 보며', '두 번째부터는 내 대사를 가리고', '마지막엔 부모님이 순서를 바꿔 질문해 보기 (예: Where are you from?을 먼저)'], parent: '아이가 틀려도 고쳐 주기보다 "Good try!"로 끝까지 말하게 해 주세요.' } },
      { type: 'stage', n: 4 },
      { type: 'card', label: '나를 소개해요', level: '상', title: '', question: '빈칸을 채워 나만의 자기소개를 완성하고, 소리 내어 읽어 보세요.<br><span class="en" style="font-size:16px;font-weight:800;line-height:2.4">Hi! My name is ______________.<br>I\'m from ______________.<br>I\'m ______ years old.<br>I like ______________.</span>',
        answer: `(예) Hi! My name is ${KID}. I'm from Korea. I'm 9 years old. I like drawing.`,
        sol: { idea: '자기소개는 이름 → 어디서 왔는지 → 나이 → 좋아하는 것 순서가 가장 자연스러워요. 첫날 반 친구들 앞에서 그대로 쓸 수 있어요.',
          steps: ['My name is + 이름', "I'm from + 나라", "I'm + 숫자 + years old", 'I like + 좋아하는 것 (drawing, soccer, cats …)'],
          mistake: '"I like draw."가 아니라 "I like drawing."처럼 -ing를 붙여요. 아직 어려우면 "I like cats."처럼 명사로 말해도 돼요.',
          more: '미국은 나이를 만 나이로 말해요. 생일이 지났는지 꼭 확인!' } }
    ]
  ]
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--main:#22a06b;--sub:#d9f5e6;--ink:#16352a}
body{font-family:'Noto Sans KR',sans-serif;background:#f6f7f5;color:#222;padding-bottom:110px}
header{background:var(--main);color:#fff;padding:18px 18px 16px}
header .s{font-size:12px;opacity:.85}header h1{font-family:'Nunito',sans-serif;font-size:24px;line-height:1.2;margin-top:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink);margin:20px 16px 8px}
.scene{font-size:12px;color:#777;margin:0 16px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ln.me{background:var(--sub)}
.ln .who{font-size:11px;font-weight:900;color:var(--ink);min-width:58px;padding-top:3px}
.ln.me .who{color:var(--main)}
.ln .tx{flex:1}
.ln .en{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;line-height:1.35}
.ln .ko{font-size:13px;color:#666;margin-top:3px}
.ln .nt{font-size:12px;color:var(--main);margin-top:3px}
.ln.play{outline:3px solid #ffcf3f}
.ln.mute .en{color:transparent;text-shadow:0 0 9px rgba(0,0,0,.35)}
.hideko .ko{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{border:0;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;background:#eee;color:#333}
.bar button.on{background:var(--main);color:#fff}
.bar .big{background:var(--ink);color:#fff;min-width:110px}
.hint{font-size:12px;color:#888;margin:14px 16px}
</style></head><body>
<header><div class="s" id="hs"></div><h1 id="ht"></h1></header>
<div id="list"></div>
<p class="hint">문장을 누르면 한 번 들려줘요. <b>역할 놀이</b>를 켜면 내 대사 차례에 소리 없이 멈춰서, 직접 말해 볼 수 있어요.</p>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html='';
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), me:!!l.me});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), me:false});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
let rate=0.85, role=false, running=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ const wait = 1200 + it.en.split(' ').length*550; setTimeout(()=>{row.classList.remove('play');res();}, wait); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } running=false; e.target.textContent='▶ 전체 듣기'; };
document.getElementById('spd').onclick=e=>{ rate = rate===0.85?0.7:rate===0.7?1:0.85; e.target.textContent='속도 '+rate; };
document.getElementById('ko').onclick=e=>{ document.body.classList.toggle('hideko'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('hideko')?'한국어 켜기':'한국어 끄기'; };
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
speechSynthesis.getVoices();
</script></body></html>
