<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 생활 첫걸음 (가족편) / Unit 1 Talking with the School
// ME: 학습자(부모) 이름. 판매용은 'Me' 또는 'Mina' 등으로 교체
const ME = 'Me';
const big = s => `<span class="en say" style="font-size:15px;font-weight:800">${s}</span>`;
window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 생활 첫걸음 (가족편)',
  gradeLabel: '주재원 가족 생활 영어',
  theme: { main: '#ff7a45', sub: '#ffe6da', ink: '#2b2d3a', card: '#fff4ee' },
  unitNo: '01', unitTitle: 'Talking with the School', startPage: 4,
  cover: { title: 'Talking with<br>the School', subtitle: '학교 등록·담임 면담·ESL 문의·결석 연락 · 가족편 Unit 1' },
  tip: '학습 팁: 하루 10분, 대화문을 소리 내어 3번씩 읽고 배우자와 역할을 바꿔 보세요. 완벽한 문장보다 "먼저 말을 꺼내는 것"이 학교와 관계를 만드는 첫걸음이에요.',
  pages: [
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Talk', title: '학교 사무실에서 등록 문의하기' },
      { type: 'listen' },
      { type: 'dialog', scene: '학교 front office(행정실). 직원이 맞아 줘요.', lines: [
        { who: 'Staff', en: 'Good morning! How can I help you?', ko: '안녕하세요! 무엇을 도와드릴까요?' },
        { who: ME, me: true, en: "Hi. I'd like to enroll my daughter.", ko: '안녕하세요. 딸을 등록하고 싶어요.' },
        { who: 'Staff', en: 'Sure. Do you have proof of address?', ko: '그럼요. 거주 증명 서류 있으세요?' },
        { who: ME, me: true, en: 'Yes. I have our lease agreement.', ko: '네, 임대 계약서가 있어요.' },
        { who: 'Staff', en: "Great. We'll also need her shot records.", ko: '좋아요. 예방접종 기록도 필요해요.' },
        { who: ME, me: true, en: 'Okay. Can I bring them tomorrow?', ko: '알겠어요. 내일 가져와도 될까요?' },
        { who: 'Staff', en: 'Of course. Take your time.', ko: '물론이죠. 천천히 하세요.' } ] },
      { type: 'section', tag: 'Key', title: '오늘의 핵심 표현' },
      { type: 'phrases', items: [
        { en: "I'd like to enroll my daughter.", ko: '딸을 등록하고 싶어요.', note: "I'd like to ~는 I want to보다 공손해요." },
        { en: 'Do you have proof of address?', ko: '거주 증명 서류 있으세요?', note: '임대 계약서·공과금 고지서 등을 요구하는 경우가 많아요.' },
        { en: 'Shot records', ko: '예방접종 기록', note: '"immunization records"라고도 해요.' },
        { en: 'Can I bring them tomorrow?', ko: '내일 가져와도 될까요?', note: 'Can I ~? = 허락·가능 여부 묻기' } ] },
      { type: 'tip', pose: 'idea', text: '등록 필요 서류는 학교·교육청마다 달라요. 방문 전에 <b>학교 홈페이지나 전화</b>로 목록을 확인하는 것이 안전해요.' }
    ],
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Conference', title: '담임 면담 & ESL 지원 묻기' },
      { type: 'phrases', items: [
        { en: 'Thank you for meeting with me.', ko: '시간 내 주셔서 감사해요.', note: '면담 시작 인사. 미국은 감사 표현이 기본이에요.' },
        { en: 'How is she doing in class?', ko: '수업 시간에 어떻게 지내나요?', note: '"How is she doing?"은 가장 무난한 질문' },
        { en: 'Does the school offer ESL support?', ko: '학교에 ESL 지원이 있나요?', note: 'ESL/ELL = 영어를 모국어로 하지 않는 학생 지원' },
        { en: 'How can I help her at home?', ko: '집에서 어떻게 도울 수 있나요?', note: '협력하려는 태도가 좋은 인상을 줘요.' },
        { en: 'Could you tell me more about that?', ko: '그것에 대해 더 말씀해 주시겠어요?', note: 'Could you ~?는 Can you ~?보다 정중해요.' },
        { en: 'Could you speak a little slower?', ko: '조금 천천히 말씀해 주시겠어요?', note: '못 알아들었을 때 망설이지 말고 요청해요.' } ] },
      { type: 'section', tag: 'Level', title: '아이 영어 수준 설명 & 결석 연락' },
      { type: 'phrases', items: [
        { en: "She's just starting to learn English.", ko: '이제 막 영어를 배우기 시작했어요.', note: '솔직히 알리면 학교가 도울 방법을 찾기 쉬워요.' },
        { en: 'She understands more than she speaks.', ko: '말하는 것보다 이해를 더 해요.', note: '초보 학습자에게 아주 흔한 상태예요.' },
        { en: 'She will be absent tomorrow.', ko: '내일 결석할 거예요.', note: '이메일 한 줄: "She has a fever."도 가능' },
        { en: 'She has a doctor\'s appointment.', ko: '병원 예약이 있어요.', note: '결석 사유는 짧게 쓰면 충분해요.' } ] },
      { type: 'grid', items: [
        { label: '연습 1', level: '하', question: '학교에 딸을 <b>등록하고 싶다</b>고 공손하게 말하는 문장은?',
          choices: ["I'd like to enroll my daughter.", 'Give me a school.', 'My daughter is school.'], answer: '①', lines: 0,
          sol: { idea: "I'd like to + 동사 = \"~하고 싶어요\"의 공손한 틀이에요. 사무실·가게·병원에서 모두 쓰여요.",
            steps: ['하고 싶은 일: enroll(등록하다)', "공손한 틀: I'd like to + enroll", '대상 붙이기: my daughter'],
            mistake: '"I want to enroll"도 틀리진 않지만 직설적으로 들릴 수 있어요. 처음 만나는 직원에게는 I\'d like to가 좋아요.',
            more: '"I\'d like to make an appointment.(예약하고 싶어요)"에도 그대로 쓸 수 있어요.' } },
        { label: '연습 2', level: '하', question: '선생님 말이 너무 빨라요. 정중하게 부탁하는 문장은?',
          choices: ['What?', 'Could you speak a little slower?', 'Speak fast.'], answer: '②', lines: 0,
          sol: { idea: 'Could you ~? = 정중하게 부탁하는 틀이에요. 뒤에 부탁할 내용을 붙여요.',
            steps: ['부탁 내용: speak slower(더 천천히 말하다)', 'a little을 넣으면 더 부드러워요', '→ Could you speak a little slower?'],
            mistake: '"What?"만 말하면 퉁명스럽게 들릴 수 있어요. "Sorry, could you repeat that?"도 좋아요.',
            parent: '못 알아듣는 것은 실례가 아니에요. 미국에서는 되묻는 것이 오히려 자연스러워요.' } }
      ] }
    ],
    [
      { type: 'stage', n: 3 },
      { type: 'grid', items: [
        { label: '연습 3', level: '중', question: '빈칸에 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">Does the school ________ ESL support?</span>', lines: 1, answer: 'offer',
          sol: { idea: 'offer = (서비스·프로그램을) 제공하다. 학교나 가게가 무엇을 해 주는지 물을 때 써요.',
            steps: ['Does the school ~? = 학교가 ~하나요?', '제공 여부를 묻는 동사: offer', 'offer 뒤에 프로그램 이름: ESL support'],
            mistake: 'Does 뒤에는 동사 원형이라 offers가 아니라 offer예요.',
            more: '"Does the school offer after-school care?(방과 후 돌봄이 있나요?)"로 응용해요.' } },
        { label: '연습 4', level: '중', question: '결석 이메일 한 줄을 완성하세요.<br><span class="en" style="font-size:15px;font-weight:800">Hello, Ms. Brown. Seoah will be ________ tomorrow.</span>', lines: 1, answer: 'absent',
          sol: { idea: 'absent = 결석한. "be absent"로 "결석하다"를 표현해요.',
            steps: ['will be + 상태 = ~일 거예요', '결석한 상태: absent', '이유를 덧붙이면: She has a fever.'],
            check: '이메일 끝에 "Thank you!"를 붙이면 공손해요. 이름과 반 이름도 쓰는 것이 좋아요.',
            mistake: 'absent의 반대는 present(출석한)예요.' } }
      ] },
      { type: 'card', label: '실전 롤플레이', level: '중', title: '배우자와 면담 연습하기', question: '한 사람은 담임 선생님, 한 사람은 나를 맡아 보세요. 한 번 할 때마다 ○에 색칠해요.<br><span style="font-size:22px;letter-spacing:6px">○ ○ ○ ○ ○</span><br>써 본 표현에 ✓ 하세요: □ Thank you for meeting with me. □ How is she doing in class? □ Does the school offer ESL support? □ How can I help her at home?',
        answer: '(활동)', sol: { idea: '면담은 짧고 명확한 질문 두세 개만 준비해도 충분해요. 소리 내어 연습하면 실전에서 훨씬 덜 떨려요.', steps: ['처음엔 책을 보며 읽기', '두 번째부터는 내 대사를 가리고 말하기', '선생님 역은 질문 순서를 바꿔서 해 보기'], parent: '통역 앱을 준비해 가도 괜찮아요. 하지만 인사와 핵심 질문은 직접 말하면 인상이 달라져요.' } },
      { type: 'stage', n: 4 },
      { type: 'card', label: '내 상황에 맞게 바꿔 쓰기', level: '상', title: '', question: '우리 아이 상황에 맞게 빈칸을 채워 소리 내어 읽어 보세요.<br><span class="en" style="font-size:16px;font-weight:800;line-height:2.4">Hi, I\'m ______________\'s mom.<br>She is in grade ______.<br>She ______________ English.<br>Could you tell me about ______________?</span>',
        answer: `(예) Hi, I'm Seoah's mom. She is in grade 3. She is just starting to learn English. Could you tell me about ESL support?`,
        sol: { idea: '아이 소개 → 학년 → 영어 수준 → 궁금한 점 순서로 말하면 짧아도 필요한 정보가 다 전달돼요.',
          steps: ["I'm + 아이 이름's mom", 'She/He is in grade + 숫자', '영어 수준: is just starting to learn / understands more than she speaks', 'Could you tell me about + 궁금한 것?'],
          mistake: '"I\'m Seoah\'s mom."이지 "I\'m mom of Seoah."라고 하지 않아요.',
          more: '아빠라면 mom 대신 dad를 쓰면 돼요. 학년은 미국식(grade 3)으로 말해요.' } }
    ]
  ]
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--main:#22a06b;--sub:#d9f5e6;--ink:#16352a}
body{font-family:'Noto Sans KR',sans-serif;background:#f6f7f5;color:#222;padding-bottom:110px}
header{background:var(--main);color:#fff;padding:18px 18px 16px}
header .s{font-size:12px;opacity:.85}header h1{font-family:'Nunito',sans-serif;font-size:24px;line-height:1.2;margin-top:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink);margin:20px 16px 8px}
.scene{font-size:12px;color:#777;margin:0 16px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ln.me{background:var(--sub)}
.ln .who{font-size:11px;font-weight:900;color:var(--ink);min-width:58px;padding-top:3px}
.ln.me .who{color:var(--main)}
.ln .tx{flex:1}
.ln .en{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;line-height:1.35}
.ln .ko{font-size:13px;color:#666;margin-top:3px}
.ln .nt{font-size:12px;color:var(--main);margin-top:3px}
.ln.play{outline:3px solid #ffcf3f}
.ln.mute .en{color:transparent;text-shadow:0 0 9px rgba(0,0,0,.35)}
.hideko .ko{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{border:0;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;background:#eee;color:#333}
.bar button.on{background:var(--main);color:#fff}
.bar .big{background:var(--ink);color:#fff;min-width:110px}
.hint{font-size:12px;color:#888;margin:14px 16px}
</style></head><body>
<header><div class="s" id="hs"></div><h1 id="ht"></h1></header>
<div id="list"></div>
<p class="hint">문장을 누르면 한 번 들려줘요. <b>역할 놀이</b>를 켜면 내 대사 차례에 소리 없이 멈춰서, 직접 말해 볼 수 있어요.</p>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html='';
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), me:!!l.me});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), me:false});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
let rate=0.85, role=false, running=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ const wait = 1200 + it.en.split(' ').length*550; setTimeout(()=>{row.classList.remove('play');res();}, wait); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } running=false; e.target.textContent='▶ 전체 듣기'; };
document.getElementById('spd').onclick=e=>{ rate = rate===0.85?0.7:rate===0.7?1:0.85; e.target.textContent='속도 '+rate; };
document.getElementById('ko').onclick=e=>{ document.body.classList.toggle('hideko'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('hideko')?'한국어 켜기':'한국어 끄기'; };
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
speechSynthesis.getVoices();
</script></body></html>
