<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 생활 첫걸음 (가족편) / Unit 06 Restaurants & Small Talk
const ME = 'Me';
const big = s => `<span class="en say" style="font-size:15px;font-weight:800">${s}</span>`;
window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 생활 첫걸음 (가족편)',
  gradeLabel: '주재원 가족 생활 영어',
  theme: { main:'#ff7a45', sub:'#ffe6da', ink:'#2b2d3a', card:'#fff4ee' },
  unitNo: '06', unitTitle: 'Restaurants & Small Talk', startPage: 44,
  cover: { title: 'Restaurants &<br>Small Talk', subtitle: '주문, 팁, 계산, 가벼운 대화까지 · 가족편 Unit 6' },
  tip: '팁 비율과 계산 방식은 식당마다 달라요. 영수증에 추천 팁이 적혀 있거나 서비스 요금이 이미 포함된 경우도 있으니 계산서를 한 번 살펴보세요.',
  pages: [
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Talk', title: '식당에서 주문하고 계산하기' },
      { type: 'listen' },
      { type: 'dialog', scene: '식당 테이블. 서버 Tom이 주문을 받아요.', lines: [
        { who: 'Tom', en: "Hi, y'all! Are you ready to order?", ko: '안녕하세요! 주문하시겠어요?' },
        { who: ME, me: true, en: "Almost. What's good here?", ko: '거의요. 여기 뭐가 맛있어요?' },
        { who: 'Tom', en: 'The grilled chicken is really popular.', ko: '그릴드 치킨이 인기가 많아요.' },
        { who: ME, me: true, en: "I'll have that, with a side salad, please.", ko: '그걸로 할게요. 사이드 샐러드도 같이요.' },
        { who: 'Tom', en: 'Anything to drink?', ko: '음료는요?' },
        { who: ME, me: true, en: 'Just water, please. Could I get a to-go box later?', ko: '물만 주세요. 나중에 포장 용기도 받을 수 있을까요?' },
        { who: 'Tom', en: 'Of course. Just let me know.', ko: '물론이죠. 말씀만 하세요.' } ] },
      { type: 'section', tag: 'Key', title: '오늘의 핵심 표현' },
      { type: 'phrases', items: [
        { en: "I'll have the chicken.", ko: '치킨으로 할게요.', note: "I'll have ~가 주문할 때 가장 자연스러워요" },
        { en: "What's good here?", ko: '여기 뭐가 맛있어요?', note: '추천을 물을 때 편한 표현' },
        { en: 'Could I get a to-go box?', ko: '포장 용기 받을 수 있을까요?', note: '남은 음식 싸 갈 때. 미국에선 흔해요' },
        { en: 'Check, please.', ko: '계산서 주세요.', note: 'Can we get the check?도 자연스러워요' } ] },
      { type: 'tip', pose: 'idea', text: '미국 식당은 서버가 자주 와서 <b>"How is everything?"</b>하고 물어요. 괜찮으면 "Everything is great, thanks!"라고 답하면 돼요.' }
    ],
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Dining', title: '식당에서 쓰는 문장' },
      { type: 'phrases', items: [
        { en: 'A table for three, please.', ko: '세 명 자리 부탁드려요.', note: '입구에서 인원을 말할 때' },
        { en: 'Can we see the menu?', ko: '메뉴 볼 수 있을까요?', note: '주문 전 시작 문장' },
        { en: 'Does this have nuts?', ko: '이거 견과류 들어 있나요?', note: '알레르기 확인은 꼭 해요' },
        { en: 'Can I get this without onions?', ko: '양파 빼 주실 수 있나요?', note: 'without = ~없이' },
        { en: 'Can we get separate checks?', ko: '계산서를 따로 해 주실 수 있나요?', note: '식당 정책에 따라 다를 수 있어요' },
        { en: 'Could I get a refill, please?', ko: '리필 부탁드려요.', note: '음료 리필은 무료인 곳이 많아요' } ] },
      { type: 'section', tag: 'Small Talk', title: '팁 문화와 가벼운 대화' },
      { type: 'phrases', items: [
        { en: 'Keep the change.', ko: '잔돈은 가지세요.', note: '팁을 현금으로 줄 때' },
        { en: 'Nice weather today, huh?', ko: '오늘 날씨 좋죠?', note: '가장 안전한 small talk 주제' },
        { en: 'Any plans for the weekend?', ko: '주말에 계획 있어요?', note: '대답은 길지 않아도 돼요' },
        { en: 'Have a good one!', ko: '좋은 하루 보내세요!', note: '헤어질 때 가볍게. 대답도 You too!' } ] },
      { type: 'grid', items: [
        { label: '연습 1', level: '하', question: '음식을 주문할 때 가장 자연스러운 문장은?',
          choices: ["I'll have the chicken.", 'Give me chicken now.', 'Chicken is mine.'], answer: '①', lines: 0,
          sol: { read: '주문할 때 자연스러운 표현을 골라요.', idea: "I'll have ~는 '~로 할게요'라는 뜻이라 메뉴를 고를 때 가장 많이 써요.",
            steps: ["I'll = I will, 지금 정했다는 느낌", 'have + 음식 이름'], check: "②는 명령처럼 들리고 ③은 뜻이 어색해요.",
            parent: '메뉴를 보며 I\'ll have ~ 문장을 하나씩 만들어 보세요.' } },
        { label: '연습 2', level: '하', question: '식사 후 남은 음식을 싸 가고 싶을 때 하는 말은?',
          choices: ['Where is the bathroom?', 'Have a good one!', 'Could I get a to-go box?'], answer: '③', lines: 0,
          sol: { read: '남은 음식을 포장하는 상황이에요.', idea: 'to-go box = 포장 용기. Could I get ~?는 요청의 만능 틀이에요.',
            steps: ['포장 = to-go', 'Could I get + 원하는 것 + ?'],
            more: 'Could I get some water? / Could I get the check?처럼 같은 틀로 확장돼요. 참고로 박스를 "doggy bag"이라고 부르기도 해요.' } }
      ] }
    ],
    [
      { type: 'stage', n: 3 },
      { type: 'grid', items: [
        { label: '연습 3', level: '중', question: '빈칸에 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">Check, ________.</span>', lines: 1, answer: 'please',
          sol: { read: '계산서를 공손하게 요청하는 말이에요.', idea: '짧은 요청 뒤에는 please를 붙이면 공손해져요.',
            steps: ['Check = 계산서', 'please를 붙여 부탁하는 말투로'],
            mistake: '미국에서는 보통 테이블에서 계산서를 받고 서버에게 결제해요. 한국처럼 카운터에서 하는 곳도 있으니 주변을 한번 살펴보세요.',
            check: '팁은 대략 15~20% 정도를 많이 말하지만 규칙은 아니에요. 영수증의 추천 팁도 참고하세요.' } },
        { label: '연습 4', level: '중', question: '헤어질 때 가볍게 인사하는 문장을 완성하세요.<br><span class="en" style="font-size:15px;font-weight:800">Have a good ________!</span>', lines: 1, answer: 'one',
          sol: { read: '헤어질 때의 가벼운 인사예요.', idea: 'Have a good one!은 Have a good day/evening 등을 대신하는 줄임 표현이에요.',
            steps: ['one = day 등을 대신하는 말', '대답: You too!'],
            more: "남부에서는 You have a good one, now! 같은 따뜻한 말투도 들을 수 있어요." } }
      ] },
      { type: 'card', label: '실전 롤플레이', level: '중', title: '배우자와 식당 가는 날 연습', question: '한 사람은 서버, 한 사람은 나를 맡아 보세요. 한 번 할 때마다 ○에 색칠해요.<br><span style="font-size:22px;letter-spacing:6px">○ ○ ○ ○ ○</span><br>잘 된 표현에 ✓ 하세요: □ I\'ll have ~. □ Could I get a to-go box? □ Check, please. □ Have a good one!',
        answer: '(활동)', sol: { idea: '식당은 주문, 요청, 계산, 인사의 흐름이 거의 정해져 있어서 한 번 익히면 어느 식당에서나 쓸 수 있어요.', steps: ['메뉴를 정해 I\'ll have ~로 주문', '남은 음식 to-go box 요청', 'Check, please와 Have a good one으로 마무리'], parent: '서버 역이 가끔 How is everything?이라고 묻도록 해 보세요.' } },
      { type: 'stage', n: 4 },
      { type: 'card', label: '내 상황에 맞게 바꿔 쓰기', level: '상', title: '', question: '내 취향과 상황에 맞게 빈칸을 채워 보세요.<br><span class="en" style="font-size:16px;font-weight:800;line-height:2.4">I\'ll have ______________.<br>Can I get this without ______________?<br>Any plans for ______________?<br>Have a good ______________!</span>',
        answer: "(예) I'll have the burger. Can I get this without onions? Any plans for the weekend? Have a good one!",
        sol: { idea: '주문, 요청, 가벼운 질문, 인사 네 가지 틀만 바꿔도 대부분의 식당 상황이 해결돼요.',
          steps: ["I'll have + 메뉴", 'Can I get this without + 빼고 싶은 재료?', 'Any plans for + 시점?', 'Have a good + one/day/weekend!'],
          mistake: '알레르기가 있으면 메뉴를 고르기 전에 먼저 말하세요. "I have a peanut allergy."처럼 간단하게요.',
          more: 'small talk는 깊은 대화가 아니라 분위기를 부드럽게 하는 인사예요. 길게 답하지 않아도 괜찮아요.' } }
    ]
  ]
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--main:#22a06b;--sub:#d9f5e6;--ink:#16352a}
body{font-family:'Noto Sans KR',sans-serif;background:#f6f7f5;color:#222;padding-bottom:110px}
header{background:var(--main);color:#fff;padding:18px 18px 16px}
header .s{font-size:12px;opacity:.85}header h1{font-family:'Nunito',sans-serif;font-size:24px;line-height:1.2;margin-top:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink);margin:20px 16px 8px}
.scene{font-size:12px;color:#777;margin:0 16px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ln.me{background:var(--sub)}
.ln .who{font-size:11px;font-weight:900;color:var(--ink);min-width:58px;padding-top:3px}
.ln.me .who{color:var(--main)}
.ln .tx{flex:1}
.ln .en{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;line-height:1.35}
.ln .ko{font-size:13px;color:#666;margin-top:3px}
.ln .nt{font-size:12px;color:var(--main);margin-top:3px}
.ln.play{outline:3px solid #ffcf3f}
.ln.mute .en{color:transparent;text-shadow:0 0 9px rgba(0,0,0,.35)}
.hideko .ko{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{border:0;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;background:#eee;color:#333}
.bar button.on{background:var(--main);color:#fff}
.bar .big{background:var(--ink);color:#fff;min-width:110px}
.hint{font-size:12px;color:#888;margin:14px 16px}
</style></head><body>
<header><div class="s" id="hs"></div><h1 id="ht"></h1></header>
<div id="list"></div>
<p class="hint">문장을 누르면 한 번 들려줘요. <b>역할 놀이</b>를 켜면 내 대사 차례에 소리 없이 멈춰서, 직접 말해 볼 수 있어요.</p>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html='';
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), me:!!l.me});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), me:false});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
let rate=0.85, role=false, running=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ const wait = 1200 + it.en.split(' ').length*550; setTimeout(()=>{row.classList.remove('play');res();}, wait); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } running=false; e.target.textContent='▶ 전체 듣기'; };
document.getElementById('spd').onclick=e=>{ rate = rate===0.85?0.7:rate===0.7?1:0.85; e.target.textContent='속도 '+rate; };
document.getElementById('ko').onclick=e=>{ document.body.classList.toggle('hideko'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('hideko')?'한국어 켜기':'한국어 끄기'; };
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
speechSynthesis.getVoices();
</script></body></html>
