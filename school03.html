<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 학교 생존 회화 / Unit 3 Bathroom, Water & Nurse
const KID = 'Seoah';
const big = s => `<span class="en say" style="font-size:15px;font-weight:800">${s}</span>`;
window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 학교 첫걸음',
  gradeLabel: '미국 초등학교 적응 회화',
  unitNo: '03', unitTitle: 'Bathroom, Water & Nurse', startPage: 20,
  cover: { title: 'Bathroom,<br>Water & Nurse', subtitle: '화장실, 물 마시기, 아플 때와 다쳤을 때 말하기 · Unit 3' },
  tip: '부모님께: 아플 때 말을 못 하는 게 가장 걱정돼요. 아픈 곳을 가리키며 "My head hurts."를 말해 보는 놀이를 자주 해 주세요.',
  pages: [
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Talk', title: '수업 중 화장실, 그리고 배가 아파요' },
      { type: 'listen' },
      { type: 'dialog', scene: '수업 중에 서아가 배가 아파요. 손을 들었어요.', lines: [
        { who: KID, me: true, en: 'Excuse me, Ms. Brown. Can I go to the bathroom?', ko: '선생님, 화장실 가도 돼요?' },
        { who: 'Ms. Brown', en: 'Yes. Take the hall pass.', ko: '그래. hall pass 가져가렴.' },
        { who: KID, me: true, en: 'Thank you. Also, my stomach hurts.', ko: '감사합니다. 그리고 배도 아파요.' },
        { who: 'Ms. Brown', en: 'Oh no. Do you want to go to the nurse?', ko: '저런. 보건실에 갈래?' },
        { who: KID, me: true, en: 'Yes, please.', ko: '네, 부탁드려요.' },
        { who: 'Ms. Brown', en: 'Okay. Emma will walk with you.', ko: '좋아. Emma가 같이 갈 거야.' },
        { who: KID, me: true, en: 'Thank you.', ko: '고맙습니다.' } ] },
      { type: 'section', tag: 'Key', title: '오늘의 핵심 표현' },
      { type: 'phrases', items: [
        { en: 'Can I go to the bathroom?', ko: '화장실 가도 돼요?', note: "미국에서는 'bathroom'이나 'restroom'을 써요." },
        { en: 'Hall pass', ko: '복도 통행증', note: '수업 중 나갈 때 들고 가는 표인 경우가 많아요.' },
        { en: 'My stomach hurts.', ko: '배가 아파요.', note: 'hurt = 아프다. 아픈 곳 이름만 바꿔요.' },
        { en: "I don't feel good.", ko: '몸이 안 좋아요.', note: '어디가 아픈지 모를 때도 쓸 수 있어요.' } ] },
      { type: 'tip', pose: 'idea', text: '미국 학교는 수업 중 화장실에 갈 때 <b>꼭 허락</b>을 받는 경우가 많아. 급하면 주저하지 말고 손을 들고 말해!' }
    ],
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Body', title: '어디가 아픈지 말하기' },
      { type: 'phrases', items: [
        { en: 'I have a headache.', ko: '머리가 아파요.', note: 'headache = 두통. have a ~로 말해요.' },
        { en: 'I have a stomachache.', ko: '배가 아파요.', note: "'My stomach hurts.'와 같은 뜻" },
        { en: 'My throat hurts.', ko: '목이 아파요.', note: '감기 걸렸을 때' },
        { en: 'I feel dizzy.', ko: '어지러워요.', note: 'dizzy = 어지러운' },
        { en: 'I think I am going to throw up.', ko: '토할 것 같아요.', note: '급할 때는 빨리 말해요.' },
        { en: 'Can I call my mom?', ko: '엄마한테 전화해도 돼요?', note: '보건실에서 보호자에게 연락할 때' } ] },
      { type: 'section', tag: 'Hurt', title: '다쳤을 때, 물이 필요할 때' },
      { type: 'phrases', items: [
        { en: 'I hurt my knee.', ko: '무릎을 다쳤어요.', note: 'hurt + my + 몸 부위' },
        { en: "I'm bleeding.", ko: '피가 나요.', note: '피가 나면 바로 알려요.' },
        { en: 'Can I get some water?', ko: '물 마셔도 돼요?', note: '수업 중 물을 마시려면 허락을 구해요.' },
        { en: 'I need a Band-Aid.', ko: '밴드가 필요해요.', note: 'Band-Aid = 반창고(밴드)' } ] },
      { type: 'grid', items: [
        { label: '연습 1', level: '하', question: '머리가 아파요. 선생님께 뭐라고 말할까요?',
          choices: ['I have a headache.', 'I need a Band-Aid.', 'Can I get some water?'], answer: '①', lines: 0,
          sol: { idea: 'head(머리)와 ache(아픔)가 합쳐진 headache가 두통이에요.',
            steps: ['머리 = head', 'ache = 아픈 느낌', "아프다고 말할 땐 'I have a ~.'"],
            check: "Band-Aid는 다친 곳에 붙이는 반창고, water는 물이에요. 머리가 아픈 상황과 맞지 않아요.",
            parent: "'I have a stomachache'를 바꿔서 headache, toothache도 말해 보게 해 주세요." } },
        { label: '연습 2', level: '하', question: '수업 중 갈증이 나서 물을 마시고 싶어요. 알맞은 말은?',
          choices: ['I hurt my knee.', "I'm bleeding.", 'Can I get some water?'], answer: '③', lines: 0,
          sol: { idea: "'Can I ~?'로 허락을 구해요. get some water는 '물을 좀 가져다 마시다'예요.",
            steps: ['하고 싶은 일: 물 마시기 = get some water', 'Can I + get some water + ?'],
            more: "학교에 따라 물병이 있어도 먼저 물어보는 게 좋아요." } }
      ] }
    ],
    [
      { type: 'stage', n: 3 },
      { type: 'grid', items: [
        { label: '연습 3', level: '중', question: '빈칸에 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">My stomach ________.</span><br><span style="font-size:12px">(뜻: 배가 아파요)</span>', lines: 1, answer: 'hurts',
          sol: { idea: '"아프다"는 hurt예요. 주어 my stomach가 하나라서 hurts처럼 s를 붙여요.',
            steps: ['아프다 = hurt', 'my stomach = 하나 → hurts'],
            mistake: "'My stomach hurt.'는 과거(아팠어요)로 들릴 수 있어요. 지금은 hurts예요." } },
        { label: '연습 4', level: '중', question: '넘어져서 무릎을 다쳤어요. 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">I ________ my knee.</span>', lines: 1, answer: 'hurt',
          sol: { idea: "다친 상황에서 'I hurt my + 부위'를 써요. I 다음이라 hurt를 그대로 써요.",
            steps: ['다치다 = hurt', 'I hurt my knee = 무릎을 다쳤어요'],
            check: '손을 다치면 "I hurt my hand."처럼 부위만 바꾸면 돼요.',
            more: "hurt는 현재·과거 모양이 같아요. '다쳤어요'도 hurt예요." } }
      ] },
      { type: 'card', label: '역할 놀이', level: '중', title: '엄마·아빠와 보건실 놀이', question: '부모님이 Ms. Brown과 보건 선생님을 맡고 나는 나 자신을 맡아요. 아픈 곳을 가리키며 말해 보세요.<br><span style="font-size:22px;letter-spacing:6px">○ ○ ○ ○ ○</span><br>잘 된 표현에 ✓ 하세요: □ I have a headache. □ My stomach hurts. □ I hurt my knee. □ Can I call my mom?',
        answer: '(활동)', sol: { idea: '아플 때는 말을 떠올리기 어려워요. 몸을 가리키며 연습하면 급할 때도 나와요.', steps: ['아픈 곳을 가리키기', 'I have a / My ... hurts 말하기', '마지막에 Thank you 붙이기'], parent: "너무 심각하게 하지 말고 놀이처럼 해 주세요." } },
      { type: 'stage', n: 4 },
      { type: 'card', label: '나만의 문장', level: '상', title: '', question: '아픈 곳과 필요한 것을 넣어 문장을 만들어 보세요.<br><span class="en" style="font-size:16px;font-weight:800;line-height:2.4">My ______________ hurts.<br>I need a ______________.<br>Can I go to the ______________?</span>',
        answer: '(예) My head hurts. I need a Band-Aid. Can I go to the nurse?',
        sol: { idea: '아프다고 말한 뒤 필요한 것이나 갈 곳을 덧붙이면 선생님이 더 빨리 도와줄 수 있어요.',
          steps: ['My + 몸 부위 + hurts', 'I need a + 필요한 것', 'Can I go to the + 장소(nurse, bathroom)?'],
          mistake: "여러 부위를 말할 땐 My hands hurt.처럼 복수는 hurt에 s를 붙이지 않아요.",
          more: '다음 유닛은 점심시간 표현이에요.' } }
    ]
  ]
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--main:#22a06b;--sub:#d9f5e6;--ink:#16352a}
body{font-family:'Noto Sans KR',sans-serif;background:#f6f7f5;color:#222;padding-bottom:110px}
header{background:var(--main);color:#fff;padding:18px 18px 16px}
header .s{font-size:12px;opacity:.85}header h1{font-family:'Nunito',sans-serif;font-size:24px;line-height:1.2;margin-top:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink);margin:20px 16px 8px}
.scene{font-size:12px;color:#777;margin:0 16px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ln.me{background:var(--sub)}
.ln .who{font-size:11px;font-weight:900;color:var(--ink);min-width:58px;padding-top:3px}
.ln.me .who{color:var(--main)}
.ln .tx{flex:1}
.ln .en{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;line-height:1.35}
.ln .ko{font-size:13px;color:#666;margin-top:3px}
.ln .nt{font-size:12px;color:var(--main);margin-top:3px}
.ln.play{outline:3px solid #ffcf3f}
.ln.mute .en{color:transparent;text-shadow:0 0 9px rgba(0,0,0,.35)}
.hideko .ko{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{border:0;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;background:#eee;color:#333}
.bar button.on{background:var(--main);color:#fff}
.bar .big{background:var(--ink);color:#fff;min-width:110px}
.hint{font-size:12px;color:#888;margin:14px 16px}
</style></head><body>
<header><div class="s" id="hs"></div><h1 id="ht"></h1></header>
<div id="list"></div>
<p class="hint">문장을 누르면 한 번 들려줘요. <b>역할 놀이</b>를 켜면 내 대사 차례에 소리 없이 멈춰서, 직접 말해 볼 수 있어요.</p>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html='';
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), me:!!l.me});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), me:false});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
let rate=0.85, role=false, running=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ const wait = 1200 + it.en.split(' ').length*550; setTimeout(()=>{row.classList.remove('play');res();}, wait); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } running=false; e.target.textContent='▶ 전체 듣기'; };
document.getElementById('spd').onclick=e=>{ rate = rate===0.85?0.7:rate===0.7?1:0.85; e.target.textContent='속도 '+rate; };
document.getElementById('ko').onclick=e=>{ document.body.classList.toggle('hideko'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('hideko')?'한국어 켜기':'한국어 끄기'; };
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
speechSynthesis.getVoices();
</script></body></html>
