<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 학교 첫걸음 / Unit 5 Recess & Making Friends · 단어 익히기 + 단어 테스트
const KID = 'Seoah';
const big = s => '<span class="en say" style="font-size:15px;font-weight:800">' + s + '</span>';
window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 학교 첫걸음',
  gradeLabel: '미국 초등학교 적응 회화',
  unitNo: '05', unitTitle: 'Recess & Making Friends', startPage: 1,
  tip: '부모님께: 하루 3~4개씩 단어를 소리 내어 읽고, 놀이터나 집에서 그 단어를 직접 몸으로 해 보면(줄 서기, 번갈아 하기 등) 훨씬 오래 기억해요.',
  pages: [
    [
      { type: 'section', tag: 'Words', title: 'Unit 05 단어 익히기' },
      { type: 'listen' },
      { type: 'phrases', items: [
        { en: 'recess', ko: '쉬는 시간', note: 'We play outside at recess. (쉬는 시간에 밖에서 놀아요)' },
        { en: 'playground', ko: '운동장, 놀이터', note: 'Let\'s run to the playground! (운동장으로 뛰어가자!)' },
        { en: 'monkey bars', ko: '구름사다리', note: 'I can cross the monkey bars. (구름사다리를 건널 수 있어)' },
        { en: 'kickball', ko: '킥볼(발야구)', note: 'Kick the ball hard! (공을 세게 차!)' },
        { en: 'share', ko: '나눠 쓰다, 같이 쓰다', note: KID + ' shares the ball. (공을 같이 써요)' },
        { en: 'take turns', ko: '번갈아 하다', note: 'Let\'s take turns on the slide. (미끄럼틀 번갈아 타자)' },
        { en: 'swing', ko: '그네', note: 'Let\'s go on the swing! (그네 타러 가자!)' },
        { en: 'partner', ko: '짝, 파트너', note: 'Can you be my partner? (내 짝 해 줄래?)' },
        { en: 'slide', ko: '미끄럼틀', note: 'I go down the slide. (미끄럼틀을 타고 내려가요.)' },
        { en: 'jump rope', ko: '줄넘기', note: 'We jump rope at recess. (쉬는 시간에 줄넘기를 해요.)' },
        { en: 'dodgeball', ko: '피구', note: 'Let\'s play dodgeball! (피구하자!)' },
        { en: 'hopscotch', ko: '사방치기', note: 'I play hopscotch. (사방치기를 해요.)' }
      ] }
    ],
    [
      { type: 'section', tag: 'Check', title: '단어 테스트' },
      { type: 'grid', items: [
        { label: 'Word 1', level: '하', question: '이 단어의 뜻을 고르세요.<br>' + big('recess'),
          choices: ['쉬는 시간', '숙제', '점심 메뉴'], answer: '①', lines: 0,
          sol: { idea: 'recess는 수업을 잠깐 "멈추고(물러나서)" 쉬는 시간이에요. 운동장에서 노는 시간을 떠올려요.',
            steps: ['re- = 뒤로, 물러나다', '수업에서 잠깐 물러나 쉬기 = 쉬는 시간', '→ ① 쉬는 시간'],
            mistake: '점심 메뉴는 lunch menu, 숙제는 homework예요. recess와 헷갈리지 않게 해요.' } },
        { label: 'Word 2', level: '하', question: '이 단어의 뜻을 고르세요.<br><span class="en" style="font-size:15px;font-weight:800">dodgeball</span>',
          choices: ['킥볼', '피구', '줄넘기'], answer: '②', lines: 0,
          sol: { idea: 'dodge는 "피하다"예요. 날아오는 공을 피하는 놀이라서 피구예요.',
            steps: ['dodge = 피하다', 'ball = 공', '→ 공을 피하는 놀이 = 피구'],
            mistake: '킥볼(kickball)은 공을 차는 놀이이고, 줄넘기는 jump rope예요.' } },
        { label: 'Word 3', level: '중', question: '빈칸에 알맞은 철자를 쓰세요. (운동장, 놀이터)<br>' + big('play _ _ _ _ _ _'), lines: 1, answer: 'ground',
          sol: { idea: 'play(놀다) + ground(땅) = 노는 땅, 운동장이에요. 두 단어를 붙인 말이에요.',
            steps: ['play = 놀다', 'ground = 땅, 바닥', '→ playground'],
            mistake: 'ground의 ou를 o 하나로 쓰지 않게 해요. "그라운드"의 "라우" 소리 = ou!' } },
        { label: 'Word 4', level: '중', question: '빈칸을 채워 단어 전체를 쓰세요. (짝, 파트너)<br>' + big('p a _ _ n e r'), lines: 1, answer: 'partner',
          sol: { idea: 'partner 안에는 part(부분, 한쪽)가 들어 있어요. 나와 함께 한쪽씩 맡는 사람이 partner예요.',
            steps: ['빈칸에 들어갈 글자: r, t', 'p-a-r-t-n-e-r', '→ partner'],
            mistake: '한국어 "파트너"처럼 -ner를 -na로 쓰지 않아요. 끝은 꼭 -er!' } },
        { label: 'Word 5', level: '중', question: '빈칸에 알맞은 단어를 고르세요.<br>' + big('We have only one ball. Let\'s ______ it.'),
          choices: ['share', 'swing', 'slide'], answer: '①', lines: 0,
          sol: { idea: '공이 하나뿐이니 친구와 "같이 써야" 해요. 같이 쓰다 = share.',
            steps: ['only one ball = 공이 하나뿐', '같이 쓰자 = Let\'s share it.', '→ ① share'],
            mistake: 'share(같이 쓰다)와 take turns(번갈아 하다)는 비슷하지만 달라요. 그네처럼 한 명씩 타는 건 take turns예요.' } },
        { label: 'Word 6', level: '중', question: '빈칸에 알맞은 단어를 고르세요.<br><span class="en" style="font-size:15px;font-weight:800">Hold the chains and go back and forth. Let\'s go on the ______.</span>',
          choices: ['slide', 'swing', 'hopscotch'], answer: '②', lines: 0,
          sol: { idea: '사슬을 잡고 앞뒤로 흔들리는 놀이기구는 그네, swing이에요. swing은 "흔들다"라는 뜻도 있어요.',
            steps: ['go back and forth = 앞뒤로 움직여요', 'chains(사슬)를 잡는 놀이기구', '→ swing'],
            mistake: 'slide는 위에서 아래로 미끄러져 내려오는 미끄럼틀, hopscotch는 땅에 그려 놓고 뛰는 놀이예요.' } }
      ] },
      { type: 'card', label: '문장 만들기', level: '상', title: '', question: '아래 두 단어를 모두 넣어 나만의 문장을 써 보세요.<br>' + big('take turns · playground'), lines: 2,
        answer: '(예) We take turns on the swings at the playground.',
        sol: { idea: '어디서(playground) 무엇을 번갈아 하는지(take turns) 생각하면 문장이 쉽게 만들어져요.',
          steps: ['누가: We / I and my friend', '무엇을: take turns on the swings / slide', '어디서: at the playground'],
          mistake: 'take turns의 s를 빼먹지 않게 해요. "번갈아"는 여러 번의 차례라서 turns예요.' } }
    ]
  ]
};

window.BOOK.pages[0].push({ type:'card', label:'따라 쓰기', level:'하', title:'소리 내어 읽으며 두 번씩 써 보기', question:'위 단어 중 4개를 골라, 소리 내어 읽으면서 두 번씩 따라 써 보세요.', lines:4, answer:'(활동)', sol:{ idea:'눈으로만 보는 것보다 소리 내어 읽으면서 손으로 쓰면 소리·철자·뜻이 함께 기억돼요.', steps:['단어를 한 번 듣고(폰 QR) 따라 말하기','한 글자씩 소리와 맞춰 쓰기','뜻을 가리고 다시 써 보기'] } });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--main:#22a06b;--sub:#d9f5e6;--ink:#16352a}
body{font-family:'Noto Sans KR',sans-serif;background:#f6f7f5;color:#222;padding-bottom:110px}
header{background:var(--main);color:#fff;padding:18px 18px 16px}
header .s{font-size:12px;opacity:.85}header h1{font-family:'Nunito',sans-serif;font-size:24px;line-height:1.2;margin-top:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink);margin:20px 16px 8px}
.scene{font-size:12px;color:#777;margin:0 16px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ln.me{background:var(--sub)}
.ln .who{font-size:11px;font-weight:900;color:var(--ink);min-width:58px;padding-top:3px}
.ln.me .who{color:var(--main)}
.ln .tx{flex:1}
.ln .en{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;line-height:1.35}
.ln .ko{font-size:13px;color:#666;margin-top:3px}
.ln .nt{font-size:12px;color:var(--main);margin-top:3px}
.ln.play{outline:3px solid #ffcf3f}
.ln.mute .en{color:transparent;text-shadow:0 0 9px rgba(0,0,0,.35)}
.hideko .ko{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{border:0;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;background:#eee;color:#333}
.bar button.on{background:var(--main);color:#fff}
.bar .big{background:var(--ink);color:#fff;min-width:110px}
#hint{position:fixed;left:12px;right:12px;max-width:440px;margin:0 auto;bottom:118px;background:#16352a;color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;text-align:center;display:none;z-index:5}#hint.on{display:block}#hint.mic{background:#22a06b}#heard{position:fixed;left:12px;right:12px;max-width:440px;margin:0 auto;bottom:96px;text-align:center;font-family:Nunito,sans-serif;font-size:14px;color:#16352a;z-index:5}
.hint{font-size:12px;color:#888;margin:14px 16px}
</style></head><body>
<header><div class="s" id="hs"></div><h1 id="ht"></h1></header>
<div id="list"></div>
<p class="hint">문장을 누르면 한 번 들려줘요. <b>역할 놀이</b>를 켜면 내 대사 차례에 소리 없이 멈춰서, 직접 말해 볼 수 있어요.</p>
<div id="hint"></div><div id="heard"></div>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html='';
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), me:!!l.me});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), me:false});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
let rate=0.85, role=false, running=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ waitTurn(row,it).then(res); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } running=false; e.target.textContent='▶ 전체 듣기'; };
document.getElementById('spd').onclick=e=>{ rate = rate===0.85?0.7:rate===0.7?1:0.85; e.target.textContent='속도 '+rate; };
document.getElementById('ko').onclick=e=>{ document.body.classList.toggle('hideko'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('hideko')?'한국어 켜기':'한국어 끄기'; };
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
/* 역할 놀이: 서아 차례 → 마이크로 듣고 말이 끝나면 넘어감, 마이크가 안 되면 탭으로 넘어감 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srBlocked = !SR, skipFn = null;
const hint = document.getElementById('hint'), heardEl = document.getElementById('heard');
const tapMsg = '👆 말한 다음 화면을 탭하면 넘어가요';
function waitTurn(row, it){ return new Promise(res=>{
  let done=false, rec=null, tries=0, heard='';
  const fin=()=>{ if(done) return; done=true; skipFn=null; try{ rec && rec.abort(); }catch(e){} hint.classList.remove('on','mic'); row.classList.remove('play'); setTimeout(()=>{ heardEl.textContent=''; res(); }, 500); };
  skipFn = fin; heardEl.textContent='';
  const showTap=()=>{ hint.className='on'; hint.textContent=tapMsg; };
  const start=()=>{ if(done) return; if(srBlocked){ showTap(); return; }
    hint.className='on mic'; hint.textContent='🎤 말해 보세요! 말이 끝나면 넘어가요 (탭하면 바로 넘어가요)';
    rec = new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    rec.onresult=e=>{ heard=[...e.results].map(r=>r[0].transcript).join(' ').trim(); if(heard) heardEl.textContent='🗣 '+heard; };
    rec.onerror=e=>{ if(/not-allowed|service-not-allowed|audio-capture|network/.test(e.error)){ srBlocked=true; } };
    rec.onend=()=>{ if(done) return; if(heard){ setTimeout(fin, 700); } else if(!srBlocked && tries<2){ tries++; start(); } else { showTap(); } };
    try{ rec.start(); }catch(e){ srBlocked=true; showTap(); } };
  start();
}); }
document.addEventListener('click', e=>{ if(skipFn && !e.target.closest('.bar')){ e.stopPropagation(); e.preventDefault(); skipFn(); } }, true);
document.getElementById('all').addEventListener('click', ()=>{ if(!running && skipFn) skipFn(); });
speechSynthesis.getVoices();
</script></body></html>
