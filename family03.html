<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 생활 첫걸음 (가족편) / Unit 3 Grocery & Shopping
// ME: 학습자(부모) 이름. 판매용은 'Me' 또는 'Mina' 등으로 교체
const ME = 'Me';
const big = s => `<span class="en say" style="font-size:15px;font-weight:800">${s}</span>`;
window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 생활 첫걸음 (가족편)',
  gradeLabel: '주재원 가족 생활 영어',
  theme: { main: '#ff7a45', sub: '#ffe6da', ink: '#2b2d3a', card: '#fff4ee' },
  unitNo: '03', unitTitle: 'Grocery & Shopping', startPage: 20,
  cover: { title: 'Grocery &<br>Shopping', subtitle: '마트·계산대·환불 교환·멤버십 · 가족편 Unit 3' },
  tip: '학습 팁: 마트에서 하루 한 문장만 써 보세요. 직원에게 "Excuse me, where can I find ~?" 한마디면 대부분 해결돼요. 매장 정책은 가게마다 다르니 영수증과 안내문을 확인하세요.',
  pages: [
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Talk', title: '마트에서 물건 찾고 계산하기' },
      { type: 'listen' },
      { type: 'dialog', scene: '마트 통로에서 직원에게 묻고, 계산대로 가요.', lines: [
        { who: ME, me: true, en: 'Excuse me. Where can I find rice?', ko: '실례합니다. 쌀은 어디에 있나요?' },
        { who: 'Staff', en: "It's in aisle 7, on the left.", ko: '7번 통로 왼쪽에 있어요.' },
        { who: ME, me: true, en: 'Thank you so much!', ko: '정말 감사합니다!' },
        { who: 'Cashier', en: 'Did you find everything okay?', ko: '찾으시는 건 다 찾으셨어요?' },
        { who: ME, me: true, en: 'Yes, I did. Thanks.', ko: '네, 찾았어요. 감사해요.' },
        { who: 'Cashier', en: 'Paper or plastic? Debit or credit?', ko: '종이봉투요, 비닐이요? 체크카드예요, 신용카드예요?' },
        { who: ME, me: true, en: 'Paper, please. Credit.', ko: '종이로 주세요. 신용카드요.' } ] },
      { type: 'section', tag: 'Key', title: '오늘의 핵심 표현' },
      { type: 'phrases', items: [
        { en: 'Where can I find rice?', ko: '쌀은 어디에서 찾을 수 있나요?', note: '"Where is ~?"보다 부드러워요. 물건 이름만 바꾸면 돼요.' },
        { en: 'Did you find everything okay?', ko: '다 찾으셨어요?', note: '계산대 인사말. "Yes, thanks."로 간단히 답해요.' },
        { en: 'Paper or plastic?', ko: '종이봉투요, 비닐이요?', note: '가게에 따라 봉투가 유료이거나 없는 경우도 있어요.' },
        { en: 'Debit or credit?', ko: '체크카드예요, 신용카드예요?', note: '미국은 카드 단말기에서 이 질문을 자주 해요.' } ] },
      { type: 'tip', pose: 'idea', text: '미국 마트는 직원이 "How are you?"라고 가볍게 물어요. <b>"Good, thanks. And you?"</b> 정도로 답하면 충분해요. 계산 후엔 "Have a nice day!"로 인사해요.' }
    ],
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Shopping', title: '물건 찾기 · 쿠폰 · 멤버십' },
      { type: 'phrases', items: [
        { en: 'Where are the eggs?', ko: '달걀은 어디에 있어요?', note: '복수 물건은 "Where are ~?"로 말해요.' },
        { en: 'Do you have this in a smaller size?', ko: '이거 더 작은 사이즈 있나요?', note: '옷·신발 가게에서 자주 써요.' },
        { en: 'Do you have any coupons?', ko: '쿠폰 있나요?', note: '앱이나 영수증에 쿠폰이 있는 경우가 많아요.' },
        { en: 'Do I need a membership card?', ko: '멤버십 카드가 필요한가요?', note: '회원 할인이 있는 마트가 많아요.' },
        { en: 'Is this on sale?', ko: '이거 세일 중인가요?', note: 'on sale = 할인 중' },
        { en: 'Can I use this coupon?', ko: '이 쿠폰 쓸 수 있나요?', note: '쓸 수 있는지 계산 전에 물어봐요.' } ] },
      { type: 'section', tag: 'Return', title: '환불 · 교환 · 영수증' },
      { type: 'phrases', items: [
        { en: "I'd like to return this.", ko: '이걸 반품하고 싶어요.', note: 'return = 돌려주고 환불받다' },
        { en: 'Can I exchange it for a different size?', ko: '다른 사이즈로 교환할 수 있나요?', note: 'exchange A for B = A를 B로 교환' },
        { en: 'Do I need the receipt?', ko: '영수증이 필요한가요?', note: '영수증이 필요한 경우가 많으니 보관해요.' },
        { en: "What's your return policy?", ko: '반품 규정이 어떻게 되나요?', note: '기간·조건은 가게마다 달라요.' } ] },
      { type: 'grid', items: [
        { label: '연습 1', level: '하', question: '마트에서 <b>달걀이 어디 있는지</b> 직원에게 물으려면?',
          choices: ['Where are the eggs?', 'Paper or plastic?', 'I\'d like to return this.'], answer: '①', lines: 0,
          sol: { idea: '"Where is/are ~?"는 위치를 묻는 기본 틀이에요. 물건이 하나면 is, 여러 개(eggs)면 are.',
            steps: ['찾는 물건: eggs(복수)', '복수이므로 be동사는 are', '→ Where are the eggs?'],
            mistake: '"Where is eggs?"는 어색해요. 복수는 are를 써요.',
            more: '더 부드럽게는 "Excuse me, where can I find eggs?"도 좋아요.' } },
        { label: '연습 2', level: '하', question: '계산대에서 점원이 "Debit or credit?"라고 물어요. 무엇을 묻는 걸까요?',
          choices: ['봉투 종류', '카드 종류', '영수증 필요 여부'], answer: '②', lines: 0,
          sol: { idea: 'debit = 체크카드(바로 출금), credit = 신용카드. 단말기에서 결제 방식을 고를 때 나오는 질문이에요.',
            steps: ['or 앞뒤에 보이는 두 단어를 확인해요', 'debit과 credit은 모두 카드 종류'],
            mistake: '봉투를 묻는 말은 "Paper or plastic?"이에요. 둘이 비슷한 구조라 헷갈리지 않게 단어를 들어요.',
            parent: '한국 카드가 해외결제에서 어떻게 처리되는지는 카드사 안내를 확인하세요.' } }
      ] }
    ],
    [
      { type: 'stage', n: 3 },
      { type: 'grid', items: [
        { label: '연습 3', level: '중', question: '빈칸에 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">Can I ________ it for a different size?</span><br>(힌트: 교환하다)', lines: 1, answer: 'exchange',
          sol: { idea: 'exchange A for B = A를 B로 바꾸다. 같은 값어치로 바꿀 때 써요.',
            steps: ['Can I + 동사 ~? = ~해도 될까요?', '교환하다 = exchange', '무엇으로 바꿀지: for a different size'],
            mistake: 'change도 쓰지만 가게에서는 exchange가 더 분명하게 전달돼요.',
            more: '환불은 "I\'d like a refund.(환불받고 싶어요)"라고 해요.' } },
        { label: '연습 4', level: '중', question: '빈칸에 알맞은 말을 쓰세요.<br><span class="en" style="font-size:15px;font-weight:800">Do I need the ________ to return this?</span><br>(힌트: 영수증)', lines: 1, answer: 'receipt',
          sol: { idea: 'receipt = 영수증. 읽을 때 p는 소리 나지 않아요(리시트).',
            steps: ['Do I need ~? = ~이 필요한가요?', '반품에 필요한 서류: receipt', '→ Do I need the receipt to return this?'],
            check: '영수증이 없으면 교환이나 매장 크레딧만 되는 경우가 많아요. 가게 규정을 직접 확인해요.',
            mistake: 'receipt 철자는 p가 들어가요. 소리와 철자가 달라 자주 틀려요.' } }
      ] },
      { type: 'card', label: '실전 롤플레이', level: '중', title: '배우자와 마트·환불 연습하기', question: '한 사람은 직원·계산원, 한 사람은 나를 맡아 보세요. 한 번 할 때마다 ○에 색칠해요.<br><span style="font-size:22px;letter-spacing:6px">○ ○ ○ ○ ○</span><br>써 본 표현에 ✓ 하세요: □ Where can I find ~? □ Paper, please. □ Do you have any coupons? □ I\'d like to return this.',
        answer: '(활동)', sol: { idea: '쇼핑 영어는 같은 질문이 반복돼요. 몇 개 문장만 입에 붙으면 실제 가게에서 바로 써먹을 수 있어요.', steps: ['처음엔 대화문을 읽으며 따라 하기', '물건 이름을 바꿔 넣어 말하기 (milk, shampoo ...)', '계산대 질문을 무작위로 던지고 답하기'], parent: '못 알아들으면 "Sorry, one more time?"이라고 가볍게 되물으면 돼요.' } },
      { type: 'stage', n: 4 },
      { type: 'card', label: '내 상황에 맞게 바꿔 쓰기', level: '상', title: '', question: '자주 사는 물건에 맞게 빈칸을 채워 소리 내어 읽어 보세요.<br><span class="en" style="font-size:16px;font-weight:800;line-height:2.4">Excuse me, where can I find ______________?<br>Do you have this in ______________?<br>I\'d like to return ______________.<br>Do I need ______________?</span>',
        answer: `(예) Excuse me, where can I find soy sauce? Do you have this in a smaller size? I'd like to return this. Do I need a membership card?`,
        sol: { idea: '찾기 → 옵션 묻기 → 반품 → 조건 확인, 쇼핑에서 자주 쓰는 네 가지 상황을 한 틀로 정리했어요.',
          steps: ['Excuse me, where can I find + 물건?', 'Do you have this in + 사이즈/색?', "I'd like to return + 물건", 'Do I need + 영수증/카드/쿠폰?'],
          mistake: '"Excuse me" 없이 바로 묻는 것보다 먼저 말을 걸면 훨씬 예의 바르게 들려요.',
          more: '앨라배마에서는 "ma\'am/sir"를 붙여 "Thank you, ma\'am."이라고 말하면 더 정중한 인상을 줘요.' } }
    ]
  ]
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--main:#22a06b;--sub:#d9f5e6;--ink:#16352a}
body{font-family:'Noto Sans KR',sans-serif;background:#f6f7f5;color:#222;padding-bottom:110px}
header{background:var(--main);color:#fff;padding:18px 18px 16px}
header .s{font-size:12px;opacity:.85}header h1{font-family:'Nunito',sans-serif;font-size:24px;line-height:1.2;margin-top:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink);margin:20px 16px 8px}
.scene{font-size:12px;color:#777;margin:0 16px 8px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ln.me{background:var(--sub)}
.ln .who{font-size:11px;font-weight:900;color:var(--ink);min-width:58px;padding-top:3px}
.ln.me .who{color:var(--main)}
.ln .tx{flex:1}
.ln .en{font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;line-height:1.35}
.ln .ko{font-size:13px;color:#666;margin-top:3px}
.ln .nt{font-size:12px;color:var(--main);margin-top:3px}
.ln.play{outline:3px solid #ffcf3f}
.ln.mute .en{color:transparent;text-shadow:0 0 9px rgba(0,0,0,.35)}
.hideko .ko{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{border:0;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;background:#eee;color:#333}
.bar button.on{background:var(--main);color:#fff}
.bar .big{background:var(--ink);color:#fff;min-width:110px}
.hint{font-size:12px;color:#888;margin:14px 16px}
</style></head><body>
<header><div class="s" id="hs"></div><h1 id="ht"></h1></header>
<div id="list"></div>
<p class="hint">문장을 누르면 한 번 들려줘요. <b>역할 놀이</b>를 켜면 내 대사 차례에 소리 없이 멈춰서, 직접 말해 볼 수 있어요.</p>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html='';
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), me:!!l.me});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), me:false});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
let rate=0.85, role=false, running=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ const wait = 1200 + it.en.split(' ').length*550; setTimeout(()=>{row.classList.remove('play');res();}, wait); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } running=false; e.target.textContent='▶ 전체 듣기'; };
document.getElementById('spd').onclick=e=>{ rate = rate===0.85?0.7:rate===0.7?1:0.85; e.target.textContent='속도 '+rate; };
document.getElementById('ko').onclick=e=>{ document.body.classList.toggle('hideko'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('hideko')?'한국어 켜기':'한국어 끄기'; };
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
speechSynthesis.getVoices();
</script></body></html>
