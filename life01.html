<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>니니랩 English 듣기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script>// 니니랩 English · 미국 학교 생활과 안전 / Unit 1 Safety Drills (불이 났을 때, 토네이도가 올 때) — 샘플
// KID: 아이 이름 (판매판은 'Mina' 등 기본값으로 교체)
const KID = 'Seoah';
const I = { ink: '#2b2d6e', grn: '#22a06b', red: '#ff5a5a', yel: '#ffd25e', sky: '#8fd3ff', gry: '#cfd3e6', org: '#ff9a3c' };
// 사람 아이콘 (간단한 막대 인형, 얼굴 없음)
const kid = (x, y, c = I.sky, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><circle cx="0" cy="-22" r="7" fill="${c}" stroke="${I.ink}" stroke-width="1.4"/><rect x="-7" y="-14" width="14" height="18" rx="5" fill="${c}" stroke="${I.ink}" stroke-width="1.4"/><line x1="-4" y1="4" x2="-5" y2="16" stroke="${I.ink}" stroke-width="2.4" stroke-linecap="round"/><line x1="4" y1="4" x2="5" y2="16" stroke="${I.ink}" stroke-width="2.4" stroke-linecap="round"/></g>`;
// 그림 1: 줄 서서 걸어 나가기 (EXIT 표시, 선생님 맨 앞)
const figFire = () => {
  let s = `<svg width="210" height="110" viewBox="0 0 210 110">`;
  s += `<rect x="150" y="10" width="52" height="88" rx="3" fill="#fff" stroke="${I.ink}" stroke-width="2"/><rect x="156" y="16" width="40" height="16" rx="2" fill="${I.red}"/><text x="176" y="28" font-size="10" font-weight="800" text-anchor="middle" fill="#fff">EXIT</text>`;
  s += kid(132, 78, I.org, 1.15);
  [104, 80, 56, 32].forEach((x, i) => { s += kid(x, 80, i === 1 ? I.grn : I.sky, 0.95); });
  s += `<path d="M20 102 H140" stroke="${I.ink}" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M134 97 L142 102 L134 107" fill="none" stroke="${I.ink}" stroke-width="1.6"/>`;
  s += `<text x="80" y="20" font-size="10" fill="${I.ink}" font-weight="700" text-anchor="middle">한 줄로, 걸어서</text>`;
  return s + `</svg>`;
};
// 그림 2: 토네이도 자세 (복도 벽 쪽, 무릎 꿇고 엎드려 손으로 머리 감싸기)
const figTornado = () => {
  let s = `<svg width="210" height="110" viewBox="0 0 210 110">`;
  s += `<rect x="8" y="8" width="194" height="14" fill="${I.gry}"/><text x="105" y="19" font-size="9" text-anchor="middle" fill="${I.ink}" font-weight="700">복도 벽 (창문 없는 곳)</text>`;
  [40, 105, 170].forEach(x => {
    s += `<g transform="translate(${x},70)"><ellipse cx="0" cy="8" rx="24" ry="13" fill="${I.sky}" stroke="${I.ink}" stroke-width="1.4"/><circle cx="-18" cy="-6" r="8" fill="${I.sky}" stroke="${I.ink}" stroke-width="1.4"/><path d="M-30 -12 Q-18 -24 -6 -12" fill="none" stroke="${I.org}" stroke-width="4" stroke-linecap="round"/></g>`;
  });
  s += `<text x="105" y="104" font-size="10" text-anchor="middle" fill="${I.ink}" font-weight="700">벽 보고 숙여서, 두 손으로 머리와 목 감싸기</text>`;
  return s + `</svg>`;
};
// 그림 3: 바깥 모이는 곳에서 선생님이 이름 부르기
const figLine = () => {
  let s = `<svg width="210" height="96" viewBox="0 0 210 96">`;
  s += `<path d="M6 86 H204" stroke="${I.grn}" stroke-width="4"/>`;
  s += kid(28, 70, I.org, 1.15) + `<rect x="40" y="38" width="38" height="18" rx="9" fill="#fff" stroke="${I.ink}"/><text x="59" y="51" font-size="9" text-anchor="middle" fill="${I.ink}" font-weight="700">${KID}?</text>`;
  [96, 120, 144, 168, 192].forEach((x, i) => { s += kid(x, 72, i === 0 ? I.grn : I.sky, 0.9); });
  s += `<rect x="86" y="20" width="44" height="18" rx="9" fill="${I.yel}" stroke="${I.ink}"/><text x="108" y="33" font-size="9" text-anchor="middle" fill="${I.ink}" font-weight="700">Here!</text>`;
  return s + `</svg>`;
};

window.BOOK = {
  subject: 'english',
  brand: ['니니', '랩', 'English'],
  series: '니니랩 English · 미국 학교 생활과 안전',
  gradeLabel: '미국 초등학교 적응 · 생활과 안전',
  unitNo: '01', unitTitle: 'Safety Drills', startPage: 1,
  cover: { title: 'Safety<br>Drills', subtitle: '불이 났을 때, 토네이도가 올 때 · 학교 안전 훈련 · Unit 1' },
  tip: '부모님께: 미국 학교는 화재 대피 훈련과 날씨(토네이도) 대피 훈련을 정기적으로 해요. 갑자기 경보가 울리면 말을 몰라도 겁먹지 않도록, "훈련은 연습이야"라는 것과 몸으로 하는 동작을 먼저 알려 주세요. 학교마다 방법이 조금씩 달라요. 입학 후 담임 선생님 안내를 꼭 따라 주세요.',
  pages: [
    // ───────── 1 알아보기 ─────────
    [
      { type: 'stage', n: 1 },
      { type: 'section', tag: 'Know', title: '미국 학교의 안전 훈련' },
      { type: 'concept', letter: 'A', title: 'Drill = 미리 해 보는 연습',
        svg: figFire(),
        body: '<b>drill(드릴)</b>은 진짜 위험이 오기 전에 미리 해 보는 <span class="hl">연습</span>이에요.<br>경보가 크게 울려도 대부분은 연습이니 놀라지 않아도 돼요.<br>가장 중요한 규칙은 하나예요: <span class="hl">선생님 말을 듣고, 반 친구들과 같이 움직이기.</span><br>화장실처럼 혼자 있을 때 경보가 울리면? 우리 반을 찾으러 가지 말고 <b>가장 가까운 선생님</b>을 따라가요.' },
      { type: 'concept', letter: 'B', title: 'Fire drill: 불이 났을 때',
        body: '① 하던 것을 <b>멈추고</b> 가방과 물건은 두고 가요.<br>② 반 친구들과 <b>한 줄</b>로 서요.<br>③ <b>뛰지 않고 걸어서</b>, <b>말하지 않고</b> 밖으로 나가요. 궁금한 건 훈련이 끝나고 물어봐요.<br>④ 정해진 곳에 모이면 선생님이 이름을 불러요. "Here!" 하고 대답해요.' },
      { type: 'concept', letter: 'C', title: 'Tornado drill: 토네이도가 올 때',
        svg: figTornado(),
        body: '토네이도는 아주 센 회오리바람이에요. 앨라배마는 봄과 늦가을에 특히 조심하는 곳이에요.<br>이때는 밖으로 나가지 않아요. <b>창문이 없는 복도나 안쪽 방</b>으로 가서<br><span class="hl">벽을 보고 무릎 꿇고 몸을 숙인 채, 두 손으로 머리와 목을 감싸요.</span>' },
      { type: 'tip', pose: 'idea', text: '불이 나면 <b>밖으로</b>, 토네이도가 오면 <b>안쪽으로</b>! 반대라서 헷갈리기 쉬워. 손으로 "밖-안" 하고 가리키며 외워 봐.' }
    ],
    // ───────── 2 말해 보기 ─────────
    [
      { type: 'stage', n: 2 },
      { type: 'section', tag: 'Talk', title: '화재 대피 훈련 날' },
      { type: 'dialog', scene: '수업 중에 경보가 "삐-삐-" 울려요.', lines: [
        { who: 'Ms. Brown', en: "It's a fire drill. Line up. Leave everything.", ko: '화재 대피 훈련이에요. 줄 서요. 물건은 두고 가요.' },
        { who: 'Ms. Brown', en: "Voices off. Walk, don't run.", ko: '조용히. 뛰지 말고 걸어요.' },
        { who: 'Ms. Brown', en: `${KID}?`, ko: `${KID}? (밖에서 이름 부르기)` },
        { who: KID, me: true, en: 'Here!', ko: '여기 있어요!' },
        { who: KID, me: true, en: 'Can I get my backpack now?', ko: '(훈련 끝나고) 이제 가방 가져가도 돼요?' },
        { who: 'Ms. Brown', en: 'Yes. The drill is over.', ko: '그래. 훈련 끝났어.' } ] },
      { type: 'section', tag: 'Talk', title: '토네이도 대피 훈련 날' },
      { type: 'dialog', lines: [
        { who: 'Ms. Brown', en: "It's a tornado drill. Go to the hallway.", ko: '토네이도 훈련이에요. 복도로 가요.' },
        { who: 'Ms. Brown', en: 'Face the wall. Get down and cover your head.', ko: '벽을 보고, 몸을 숙이고 머리를 감싸요.' },
        { who: KID, me: true, en: "I'm scared.", ko: '무서워요.' },
        { who: 'Ms. Brown', en: "It's okay. It's just practice.", ko: '괜찮아. 그냥 연습이야.' } ] },
      { type: 'section', tag: 'Key', title: '꼭 알아들어야 할 말' },
      { type: 'phrases', items: [
        { en: "Walk, don't run.", ko: '뛰지 말고 걸어요.', note: '' },
        { en: 'Voices off.', ko: '조용히 해요.', note: '훈련할 때 가장 많이 듣는 말. Eyes on me(선생님 봐요)도 자주 써요.' },
        { en: 'Get down and cover your head.', ko: '몸을 숙이고 머리를 감싸요.', note: '토네이도 훈련 때. 두 손으로 머리와 목을 덮어요.' },
        { en: 'Stay with your class.', ko: '반 친구들과 같이 있어요.', note: '절대 혼자 다른 데로 가지 않아요.' } ] }
    ],
    // ───────── 3 확인하기 ─────────
    [
      { type: 'stage', n: 3 },
      { type: 'grid', items: [
        { label: '확인 1', level: '하', question: '화재 대피 훈련 경보가 울렸어요. 어떻게 할까요?',
          choices: ['가방을 챙겨 뛰어 나가요.', '물건은 두고 줄 서서 걸어 나가요.', '책상 밑에 숨어요.'], answer: '②', lines: 0,
          sol: { idea: '불이 났을 때는 빨리, 하지만 안전하게 밖으로 나가야 해요.',
            steps: ['물건을 챙기면 늦어져요 → 두고 가요', '뛰면 넘어지고 부딪혀요 → 걸어요', '선생님 뒤에 한 줄로 → 아무도 빠지지 않아요'],
            check: '책상 밑에 숨는 건 화재 대피가 아니에요. 불이 나면 밖으로 나가요.',
            parent: '"집에서 불이 나면 어디로 나갈까?"도 함께 이야기해 주세요.' } },
        { label: '확인 2', level: '하', question: '선생님이 <span class="en say" style="font-weight:800">"Get down and cover your head."</span>라고 했어요. 어떤 자세를 할까요?',
          choices: ['손을 들고 서 있어요.', '무릎 꿇고 숙여서 두 손으로 머리를 감싸요.', '창문 옆에 서서 밖을 봐요.'], answer: '②', lines: 0,
          sol: { idea: 'get down = 몸을 낮추다, cover your head = 머리를 덮다.',
            steps: ['몸을 낮게', '두 손으로 머리와 목을 덮어요', '창문에서 멀리'],
            mistake: '창문 옆보다 창문 없는 안쪽이 더 안전해요. 바람에 날아오는 물건이 있을 수 있거든요.' } },
        { label: '확인 3', level: '중', question: `밖에 모였더니 선생님이 "${KID}?" 하고 이름을 불러요. 알맞은 대답을 쓰세요.`, figure: figLine(), lines: 1, answer: 'Here!',
          sol: { idea: '밖에 모이면 선생님이 모두 나왔는지 이름을 불러 확인해요. 이름이 불리면 큰 소리로 대답해요.',
            steps: [`선생님: "${KID}?"`, '나: "Here!" (여기 있어요!)'],
            more: '아침 출석 부를 때도 똑같이 "Here!"라고 대답해요.' } },
        { label: '확인 4', level: '중', question: '불이 났을 때와 토네이도가 올 때, 가는 곳을 선으로 이어 보세요.<br>Fire drill ·　　　· 복도·안쪽 방<br>Tornado drill ·　　　· 학교 밖 모이는 곳', lines: 1, answer: 'Fire drill → 학교 밖 모이는 곳, Tornado drill → 복도·안쪽 방',
          sol: { idea: '불은 건물 안이 위험하고, 토네이도는 바깥이 위험해요.',
            steps: ['불 → 밖으로', '토네이도 → 안쪽으로, 창문 없는 곳'],
            check: '개념 B, C의 그림과 같아요.' } }
      ] },
      { type: 'stage', n: 4 },
      { type: 'card', label: '집에서 연습', level: '중', title: ' 경보 놀이',
        question: '부모님이 "삐-삐-" 하고 경보 소리를 내고 영어로 말해요. 듣고 몸으로 해 보세요.<br><span class="en say" style="font-size:14px;font-weight:800">Line up! · Walk, don\'t run! · Get down! · Cover your head! · (아이 이름)?</span><br>잘 된 것에 ✓ 하세요: □ 줄 서기 □ 걸어서 가기 □ 숙이기 □ 머리 감싸기 □ "Here!" 대답',
        answer: '(활동)',
        sol: { idea: '급할 때는 말보다 몸이 먼저 기억해요. 놀이처럼 짧게 여러 번 해 주세요.',
          steps: ['영어 지시를 듣고', '바로 몸으로 따라 하고', '마지막에 이름을 부르면 "Here!"'],
          parent: '무섭게 하지 말고 게임처럼 해 주세요. "연습이라서 괜찮아"를 꼭 덧붙여 주세요.' } },
      { type: 'summary', items: [
        { title: 'Fire drill', body: '멈추기 → 줄 서기<br>걸어서 밖으로' },
        { title: 'Tornado drill', body: '안쪽 복도로<br>숙이고 머리 감싸기' },
        { title: '꼭 할 말', body: "Here!<br>I'm scared. (무서워요)" },
        { title: '가장 중요한 규칙', body: '선생님 말 듣기<br>반 친구들과 같이' } ] }
    ]
  ]
};
</script>

<p class="hint">문장을 누르면 한 번 들려줘요.<br><b>역할 놀이</b>: 내 대사 차례에 멈춰서 직접 말해요.<br><b>따라 하기</b>: 켜고 문장을 누르면 듣고 → 내 목소리 녹음 → 내 목소리와 원래 소리를 이어서 들려줘요.<br><b>질문 시간</b>: 상대 말을 듣고 내가 대답해 보는 퀴즈예요.</p>

<div id="quiz"><div class="card"><div class="qn" id="qn"></div><div class="q" id="qq"></div><div class="qk" id="qk"></div><div class="ak" id="qak"></div><div class="a" id="qa"></div><div class="qb"><button id="qrep">🔁 다시 듣기</button><button class="go" id="qnext">다음 ▶</button><button id="qend">그만</button></div></div></div>
<div class="bar">
  <button class="big" id="all">▶ 전체 듣기</button>
  <button id="spd">속도 0.85</button>
  <button id="ko">한국어 끄기</button>
  <button id="role">역할 놀이</button>
  <button id="rep">따라 하기</button>
  <button id="qz">질문 시간</button>
</div>
<script>
const B = window.BOOK; const T = Object.assign({main:'#22a06b',sub:'#d9f5e6',ink:'#16352a'}, B.theme||{});
for (const [k,v] of Object.entries(T)) document.documentElement.style.setProperty('--'+k, v);
document.getElementById('hs').textContent = `${B.series} · Unit ${B.unitNo}`;
document.getElementById('ht').textContent = B.unitTitle;
const strip = s => (s||'').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const items = []; let html=''; let grp=0;
for (const pg of B.pages) for (const b of pg) {
  if (b.type==='section' && (b.tag)) html += `<div class="sec">${b.tag} · ${strip(b.title)}</div>`;
  if (b.type==='dialog') { grp++; if (b.scene) html += `<div class="scene">${strip(b.scene)}</div>`;
    for (const l of b.lines){ const i=items.length; items.push({en:strip(l.en), ko:strip(l.ko), me:!!l.me, g:grp});
      html += `<div class="ln ${l.me?'me':''}" data-i="${i}"><div class="who">${strip(l.who)}</div><div class="tx"><div class="en">${strip(l.en)}</div><div class="ko">${strip(l.ko)}</div></div></div>`; } }
  if (b.type==='phrases') for (const x of b.items){ const i=items.length; items.push({en:strip(x.en), ko:strip(x.ko), me:false, g:0});
      html += `<div class="ln" data-i="${i}"><div class="tx"><div class="en">${strip(x.en)}</div><div class="ko">${strip(x.ko)}</div>${x.note?`<div class="nt">${strip(x.note)}</div>`:''}</div></div>`; }
}
document.getElementById('list').innerHTML = html;
const LS=(k,v)=>{ try{ if(v===undefined) return JSON.parse(localStorage.getItem('nl_'+k)); localStorage.setItem('nl_'+k, JSON.stringify(v)); }catch(e){ return null; } };
let rate=LS('rate')||0.75, role=false, running=false, repMode=false;
const rows=[...document.querySelectorAll('.ln')];
function voice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Jenny|Aria|Ava|Allison/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en')); }
function say(i){ return new Promise(res=>{ const it=items[i]; rows.forEach(r=>r.classList.remove('play')); const row=rows[i]; row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
  if (role && it.me){ waitTurn(row,it).then(res); return; }
  const u=new SpeechSynthesisUtterance(it.en); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v;
  u.onend=()=>{row.classList.remove('play');res();}; u.onerror=()=>res(); speechSynthesis.speak(u); }); }
rows.forEach(r=>r.onclick=()=>{ running=false; speechSynthesis.cancel(); if(repMode) repeatRow(+r.dataset.i); else say(+r.dataset.i); });
document.getElementById('all').onclick=async e=>{ if(running){running=false;speechSynthesis.cancel();e.target.textContent='▶ 전체 듣기';return;}
  running=true; e.target.textContent='■ 멈춤'; for(let i=0;i<items.length&&running;i++){ await say(i); await new Promise(r=>setTimeout(r,500)); } if(running){ const p=prog(); p.listen=1; saveProg(p); } running=false; e.target.textContent='▶ 전체 듣기'; };
const SPD=[0.6,0.75,0.9,1], SPN={0.6:'아주 천천히',0.75:'천천히',0.9:'조금 빠르게',1:'보통'};
const spdB=document.getElementById('spd'); const showSpd=()=>spdB.textContent='속도: '+(SPN[rate]||rate); showSpd();
spdB.onclick=()=>{ const i=SPD.indexOf(rate); rate=SPD[(i+1)%SPD.length]; LS('rate',rate); showSpd(); };
const koB=document.getElementById('ko'); const setKo=h=>{ document.body.classList.toggle('hideko',h); koB.classList.toggle('on',h); koB.textContent=h?'한국어 켜기':'한국어 끄기'; LS('hideko',h); }; setKo(!!LS('hideko')); koB.onclick=()=>setKo(!document.body.classList.contains('hideko'));
document.getElementById('role').onclick=e=>{ role=!role; e.target.classList.toggle('on',role); rows.forEach(r=>{ const it=items[+r.dataset.i]; r.classList.toggle('mute', role&&it.me); }); };
/* 역할 놀이: 서아 차례 → 마이크로 듣고 말이 끝나면 넘어감, 마이크가 안 되면 탭으로 넘어감 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srBlocked = !SR, skipFn = null;
const hint = document.getElementById('hint'), heardEl = document.getElementById('heard');
const tapMsg = '👆 말한 다음 화면을 탭하면 넘어가요';
function waitTurn(row, it){ return new Promise(res=>{
  let done=false, rec=null, tries=0, heard='';
  const fin=()=>{ if(done) return; done=true; skipFn=null; try{ rec && rec.abort(); }catch(e){} hint.classList.remove('on','mic'); row.classList.remove('play'); setTimeout(()=>{ heardEl.textContent=''; res(); }, 500); };
  skipFn = fin; heardEl.textContent=''; heardEl.dataset.last='';
  const showTap=()=>{ hint.className='on'; hint.textContent=tapMsg; };
  const start=()=>{ if(done) return; if(srBlocked){ showTap(); return; }
    hint.className='on mic'; hint.textContent='🎤 말해 보세요! 말이 끝나면 넘어가요 (탭하면 바로 넘어가요)';
    rec = new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    rec.onresult=e=>{ heard=[...e.results].map(r=>r[0].transcript).join(' ').trim(); if(heard){ heardEl.textContent='🗣 '+heard; heardEl.dataset.last=heard; } };
    rec.onerror=e=>{ if(/not-allowed|service-not-allowed|audio-capture|network/.test(e.error)){ srBlocked=true; } };
    rec.onend=()=>{ if(done) return; if(heard){ setTimeout(fin, 700); } else if(!srBlocked && tries<2){ tries++; start(); } else { showTap(); } };
    try{ rec.start(); }catch(e){ srBlocked=true; showTap(); } };
  start();
}); }
document.addEventListener('click', e=>{ if(skipFn && !e.target.closest('.bar') && !e.target.closest('.qb')){ e.stopPropagation(); e.preventDefault(); skipFn(); } }, true);
document.getElementById('all').addEventListener('click', ()=>{ if(!running && skipFn) skipFn(); });
/* 진도 별 */
const PK='prog_'+(location.pathname.split('/').pop()||'page');
function prog(){ return LS(PK)||{}; }
function saveProg(p){ LS(PK,p); drawStars(); }
function drawStars(){ const p=prog(); const s=[]; if(p.listen) s.push('🎧 전체 듣기 완료'); if(p.rep) s.push('🎙 따라 하기 '+p.rep+'문장'); if(p.quiz!=null) s.push('⭐'.repeat(p.quiz)+'☆'.repeat(Math.max(0,(p.qmax||5)-p.quiz))+' 질문 시간'); document.getElementById('stars').textContent=s.join('  ·  '); }
drawStars();
function speakP(text){ return new Promise(res=>{ const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate; const v=voice(); if(v) u.voice=v; u.onend=res; u.onerror=res; speechSynthesis.speak(u); }); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* 따라 하기: 듣기 → 녹음 → 내 목소리 → 원래 소리 */
let micStream=null, recBusy=false, stopRec=null;
const repB=document.getElementById('rep');
repB.onclick=()=>{ repMode=!repMode; repB.classList.toggle('on',repMode); if(repMode && role) document.getElementById('role').click(); hint.className=repMode?'on':''; hint.textContent=repMode?'🎙 따라 할 문장을 눌러 보세요':''; if(repMode) setTimeout(()=>{ if(!recBusy) hint.className=''; },2500); };
async function repeatRow(i){
  if(recBusy){ stopRec&&stopRec(); return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ hint.className='on'; hint.textContent='이 폰에서는 녹음이 안 돼요. 듣고 소리 내어 따라 해 보세요'; await say(i); return; }
  recBusy=true; const row=rows[i], it=items[i];
  try{
    row.classList.add('play'); row.scrollIntoView({block:'center',behavior:'smooth'});
    hint.className='on'; hint.textContent='👂 잘 들어 보세요'; await speakP(it.en);
    if(!micStream) micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(micStream); const chunks=[]; mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const stopped=new Promise(r=>mr.onstop=r);
    row.classList.remove('play'); row.classList.add('rec'); hint.className='on mic'; hint.style.background='#ff4f7b'; hint.textContent='🎙 따라 말해 보세요! (다 말하면 문장을 한 번 더 누르세요)';
    mr.start(); const words=it.en.split(/\s+/).length; const lim=Math.min(8000, 2500+words*600);
    await Promise.race([wait(lim), new Promise(r=>stopRec=r)]); stopRec=null; mr.stop(); await stopped; row.classList.remove('rec');
    hint.style.background=''; hint.className='on'; hint.textContent='🔊 내 목소리';
    const au=new Audio(URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}))); await new Promise(r=>{ au.onended=r; au.onerror=r; au.play().catch(r); });
    await wait(300); hint.textContent='🔊 원래 소리'; row.classList.add('play'); await speakP(it.en); row.classList.remove('play');
    const p=prog(); p.rep=(p.rep||0)+1; saveProg(p);
    hint.textContent='잘했어요! 다른 문장도 눌러 보세요'; setTimeout(()=>{ if(!recBusy) hint.className=''; },2000);
  }catch(e){ hint.style.background=''; hint.className='on'; hint.textContent='마이크를 쓸 수 없어요. 듣고 소리 내어 따라 해 보세요'; row.classList.remove('rec','play'); }
  recBusy=false;
}
/* 질문 시간: 상대 말 듣기 → 내가 대답 → 정답 듣기 */
const pairs=[]; for(let i=0;i<items.length-1;i++) if(!items[i].me && items[i+1].me && items[i].g && items[i].g===items[i+1].g) pairs.push(i);
const qzB=document.getElementById('qz'); if(!pairs.length) qzB.style.display='none';
const Q={on:false};
const qEl=id=>document.getElementById(id);
function qEnd(){ Q.on=false; speechSynthesis.cancel(); if(skipFn) skipFn(); qEl('quiz').classList.remove('on'); hint.className=''; }
async function qAsk(){
  const n=Q.k, i=Q.list[n]; const a=items[i+1];
  qEl('qn').textContent='질문 '+(n+1)+' / '+Q.list.length; qEl('qq').textContent=items[i].en; qEl('qk').textContent=document.body.classList.contains('hideko')?'':items[i].ko;
  qEl('qak').textContent='내 대답: '+(a.ko||'')+' → 영어로?'; qEl('qa').textContent=''; qEl('qnext').disabled=true;
  await speakP(items[i].en); if(!Q.on) return;
  await waitTurn(rows[i+1], a); if(!Q.on) return;
  const said=(heardEl.dataset.last||'').toLowerCase(), want=a.en.toLowerCase().replace(/[^a-z' ]/g,'');
  const ws=want.split(' ').filter(w=>w.length>2); const hit=ws.filter(w=>said.includes(w)).length;
  Q.score += (!said || !ws.length || hit>=Math.ceil(ws.length/2)) ? 1 : 0;
  qEl('qa').textContent=a.en; await speakP(a.en); qEl('qnext').disabled=false;
}
qzB.onclick=()=>{ if(role) document.getElementById('role').click(); if(repMode) repB.click(); running=false; speechSynthesis.cancel();
  const sh=[...pairs].sort(()=>Math.random()-.5).slice(0,5); Object.assign(Q,{on:true,list:sh,k:0,score:0}); qEl('quiz').classList.add('on'); qAsk(); };
qEl('qrep').onclick=async e=>{ e.stopPropagation(); speechSynthesis.cancel(); await speakP(items[Q.list[Q.k]].en); };
qEl('qnext').onclick=e=>{ e.stopPropagation(); Q.k++; if(Q.k<Q.list.length){ qAsk(); return; }
  const p=prog(); p.quiz=Math.max(p.quiz||0,Q.score); p.qmax=Q.list.length; saveProg(p);
  qEl('qn').textContent='끝!'; qEl('qq').textContent='⭐'.repeat(Q.score)+'☆'.repeat(Q.list.length-Q.score); qEl('qk').textContent=''; qEl('qak').textContent=Q.score===Q.list.length?'전부 대답했어요! 최고! 🎉':'잘했어요! 한 번 더 하면 별이 늘어요'; qEl('qa').textContent=''; qEl('qnext').disabled=true; };
qEl('qend').onclick=e=>{ e.stopPropagation(); qEnd(); };
speechSynthesis.getVoices();
</script></body></html>
